<script>
// ══ BOOT GUARD ══ If the 3D page can't start (no WebGL, three.js blocked, a startup crash), the
// visitor is handed the text-only store (SHOP, next script) instead of a black screen. The red
// error box this grew out of is now ?debug only: customers never see raw errors, and a phone
// can still be debugged by opening the page with ?debug.
(function(){
  var DEBUG = /[?&]debug\b/.test(location.search);
  function box(msg){
    if(!DEBUG) return;
    var d = document.getElementById('boot-err');
    if(!d){
      d = document.createElement('div'); d.id = 'boot-err';
      d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:2147483647;'
        + 'background:rgba(130,10,10,0.93);color:#fff;font:12px/1.45 monospace;padding:10px 12px;'
        + 'border-radius:8px;white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto;';
      (document.body || document.documentElement).appendChild(d);
    }
    if(d.textContent.indexOf(msg) === -1) d.textContent += msg + '\n';
  }
  window.addEventListener('error', function(e){
    var m = e.message || 'script error';
    if(e.filename) m += '  @' + e.filename.split('/').pop() + ':' + e.lineno;
    else if(e.target && e.target.src) m += '  [failed to load: ' + e.target.src + ']';
    box(m);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    box('promise: ' + ((e.reason && (e.reason.message || e.reason.stack)) || e.reason));
  });
  function noWebGL(){
    try {
      // Reuse the renderer: probing with another context adds startup work and GPU memory.
      var r = window.renderer;
      if(r && r.getContext){ var live = r.getContext(); return !live || live.isContextLost(); }
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if(gl){ var release = gl.getExtension('WEBGL_lose_context'); if(release) release.loseContext(); }
      return !gl;
    }
    catch(err){ return true; }
  }
  window.addEventListener('load', function(){
    // Can't start at all: open the list straight away.
    var why = typeof THREE === 'undefined' ? 'three.js did not load (CDN blocked or offline?)'
            : noWebGL() ? 'WebGL is not available on this device/browser' : null;
    if(why){ box(why); if(window.SHOP) SHOP.fallback(); return; }
    // Started but never drew a frame: point at the list rather than forcing it on top — a slow
    // phone may still get there.
    setTimeout(function(){
      var r = window.renderer;
      if(window.scene && document.querySelector('#canvas-container canvas') && !(r && r.info && r.info.render.frame === 0)) return;
      box('page loaded but the 3D scene never started');
      if(window.SHOP) SHOP.stalled();
    }, 20000);
  });
})();
</script>
<script>
// ══════════════════════════════════════════════
// SHOP — the store's whole connection to Shopify
// ══════════════════════════════════════════════
// Talks to the Storefront API directly: products, policies, and the cart at checkout. It
// replaced the Buy Button SDK, which Shopify deprecated in January 2025.
//
// THE BAG IS LOCAL UNTIL CHECKOUT. Nothing goes to Shopify while the visitor shops; the Shopify
// cart is created once, at checkout, from exactly what is in the bag. The old code kept a
// Shopify cart in step with every click, and every path that forgot to (remove, + / -, the bag
// shattering) left the customer paying for something that was no longer on screen.
//
// It is its own script, loaded before three.js, on purpose: the text-only store and the policy
// links have to keep working on a device where the 3D page never starts.
var SHOP = (function(){
  'use strict';

  // The Storefront token is public by design — it can read products and make carts, nothing else.
  var DOMAIN = 'nztwe0-nf.myshopify.com';
  var TOKEN  = '468c3e43c5e1b72800ae8af8afe2d886';
  // Shopify supports each API version for a year and then quietly serves the oldest supported
  // one instead. Bump this once a year.
  var API    = 'https://' + DOMAIN + '/api/2026-07/graphql.json';
  // The address the Contact link writes to. Empty hides the link.
  var CONTACT_EMAIL = '';
  // Offered for listings with no size variants (the 3D size toggle's stand-in is the same three).
  // The pick reaches the order as a "Size" line note — see add().
  var STAND_IN_SIZES = ['S', 'M', 'L'];
  // Used until the live policy list arrives, so the Privacy link is there from the first frame.
  var PRIVACY_URL = 'https://checkout.shopify.com/71938572374/policies/40583823446.html?locale=en';

  var bag = [];            // THE bag. The 3D cart's cart.items is this same array.
  var subs = [];
  var products = null;     // site-shaped products (see siteProduct), once Shopify answers
  var productWaiters = [];
  var loadFailed = false;
  var busy = false;
  var ui = {};
  var uid = 0;

  function gql(query, variables){
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': TOKEN },
      body: JSON.stringify({ query: query, variables: variables || {} })
    }).then(function(r){
      if(!r.ok) throw new Error('Shopify answered ' + r.status);
      return r.json();
    }).then(function(j){
      if(j.errors && j.errors.length) throw new Error(j.errors[0].message);
      return j.data;
    });
  }

  // ── products ───────────────────────────────────────────────────────────────
  var PRODUCTS_Q = 'query($after:String){products(first:250,after:$after){pageInfo{hasNextPage endCursor}' +
    'nodes{id title handle productType vendor description' +
    ' images(first:20){nodes{url altText}}' +
    ' variants(first:100){nodes{id title availableForSale price{amount currencyCode} selectedOptions{name value}}}}}}';

  // The shape the 3D floors were built around (it is what the Buy Button SDK used to hand back),
  // so one object serves the wheel, the detail view, the bag and the text-only store.
  function siteProduct(n){
    var vs = n.variants.nodes.map(function(v){
      return { id: v.id, title: v.title, available: v.availableForSale, price: v.price, selectedOptions: v.selectedOptions || [] };
    });
    var sizes = [], lo = Infinity, hi = 0, any = false;
    vs.forEach(function(v){
      if(v.title && v.title !== 'Default Title') sizes.push(v.title);
      if(v.available) any = true;
      var a = parseFloat(v.price && v.price.amount);
      if(a >= 0){ lo = Math.min(lo, a); hi = Math.max(hi, a); }
    });
    var imgs = n.images.nodes;
    var p = {
      id: n.id,
      shopifyId: n.id,
      name: n.title,
      price: lo === Infinity ? 0 : lo,      // the lowest variant's — a size can cost more, never less
      priceMax: hi,
      currency: (vs[0] && vs[0].price && vs[0].price.currencyCode) || 'USD',
      designer: n.vendor || 'Chrysolin',
      desc: n.description || '',
      sizes: sizes,
      image: imgs.length ? imgs[0].url : '',
      shopifyHandle: n.handle,
      shopifyVariants: vs,
      images: imgs.map(function(i){ return i.url; }),
      imageAlts: imgs.map(function(i){ return i.altText || n.title; }),
      productType: n.productType || ''
    };
    if(!any) p.sold = true;
    return p;
  }

  function fetchAllProducts(){
    var out = [];
    function page(after){
      return gql(PRODUCTS_Q, { after: after || null }).then(function(d){
        d.products.nodes.forEach(function(n){ out.push(siteProduct(n)); });
        return d.products.pageInfo.hasNextPage ? page(d.products.pageInfo.endCursor) : out;
      });
    }
    return page(null);
  }

  var RETRY_MS = [2000, 5000, 10000, 20000];
  function loadProducts(tries){
    fetchAllProducts().then(function(list){
      products = list; loadFailed = false;
      var w = productWaiters; productWaiters = [];
      w.forEach(function(cb){ try { cb(list); } catch(e){ console.error('[SHOP] product listener failed', e); } });
      if(ui.store && ui.store.open) renderList();
    }).catch(function(e){
      console.warn('[SHOP] product fetch failed', e);
      if(tries < RETRY_MS.length) setTimeout(function(){ loadProducts(tries + 1); }, RETRY_MS[tries]);
      else { loadFailed = true; if(ui.store && ui.store.open) renderList(); }
    });
  }
  function onProducts(cb){ if(products) cb(products); else productWaiters.push(cb); }

  // ── prices ─────────────────────────────────────────────────────────────────
  function money(n, cur){
    n = +n;
    try {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: cur || 'USD',
        minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }).format(n);
    } catch(e){ return '$' + (n % 1 ? n.toFixed(2) : String(n)); }
  }
  // What a product card says where the price goes. Never a number that checkout won't charge:
  // no price at all for stand-in art, SOLD OUT when nothing is left, FROM when sizes differ.
  function priceLabel(p){
    if(!p || !p.shopifyVariants) return '';
    if(p.sold) return 'SOLD OUT';
    if(!(p.price > 0)) return '';
    return (p.priceMax > p.price ? 'FROM ' : '') + money(p.price, p.currency);
  }

  // ── the bag ────────────────────────────────────────────────────────────────
  // The variant a size label means. A product with sizes and no matching size gets NOTHING —
  // the old code fell back to the first size in stock, which ships the wrong garment.
  function variantFor(p, sizeLabel){
    var vs = p && p.shopifyVariants;
    if(!vs || !vs.length) return null;
    if(vs.length === 1) return vs[0];
    if(!sizeLabel) return null;
    for(var i = 0; i < vs.length; i++){
      if(vs[i].title === sizeLabel) return vs[i];
      var o = vs[i].selectedOptions;
      for(var j = 0; j < o.length; j++) if(o[j].value === sizeLabel) return vs[i];
    }
    return null;
  }
  function no(msg){ return { ok: false, msg: msg }; }
  function label(it){ return it.name + (it.size ? ' (' + it.size + ')' : ''); }

  // Only something checkout can actually sell gets into the bag, and a refusal says why.
  function add(p, sizeLabel){
    if(!p || !p.shopifyVariants || !p.shopifyVariants.length) return no('This piece isn’t for sale online yet.');
    if(p.sold) return no(p.name + ' is sold out.');
    var v = variantFor(p, sizeLabel);
    if(!v) return no(sizeLabel ? p.name + ' doesn’t come in ' + sizeLabel + '.' : 'Choose a size for ' + p.name + ' first.');
    if(!v.available) return no(p.name + (p.shopifyVariants.length > 1 ? ' in ' + v.title : '') + ' is sold out.');
    var price = parseFloat(v.price && v.price.amount);
    if(!(price > 0)) return no(p.name + ' isn’t for sale yet.');
    // A listing with no size variants is still offered in S/M/L (STAND_IN_SIZES, and the 3D size
    // toggle's stand-in). That pick can't choose a variant, so it rides to the order as a "Size"
    // line note, and each size is its own bag line.
    var real = p.shopifyVariants.length > 1;
    var note = !real && sizeLabel && sizeLabel !== v.title ? sizeLabel : '';
    return { ok: true, item: addLine({
      cartId: v.id + (note ? '|' + note : ''), id: p.id, variantId: v.id, name: p.name, price: price,
      currency: (v.price && v.price.currencyCode) || 'USD',
      size: real ? v.title : note,
      attrs: note ? [{ key: 'Size', value: note }] : undefined
    }) };
  }
  // Lines with the same cartId stack. `attrs` ([{key, value}]) ride to the order as line
  // properties — the customizer uses them, which is why its cartId includes the design.
  function addLine(line){
    for(var i = 0; i < bag.length; i++) if(bag[i].cartId === line.cartId){ bag[i].qty++; changed(); return bag[i]; }
    line.qty = 1;
    bag.push(line);
    changed();
    return line;
  }
  function removeAt(i){ if(i >= 0 && i < bag.length){ bag.splice(i, 1); changed(); } }
  function setQty(i, q){
    if(i < 0 || i >= bag.length) return;
    if(q <= 0) bag.splice(i, 1); else bag[i].qty = q;
    changed();
  }
  function count(){ var c = 0; bag.forEach(function(it){ c += it.qty; }); return c; }
  function subtotal(){ var t = 0; bag.forEach(function(it){ t += it.price * it.qty; }); return t; }
  function subscribe(fn){ subs.push(fn); }
  function changed(){
    subs.forEach(function(fn){ try { fn(); } catch(e){ console.error('[SHOP] bag listener failed', e); } });
    if(ui.store && ui.store.open) renderBag();
  }

  // ── checkout ───────────────────────────────────────────────────────────────
  var CART_CREATE = 'mutation($input:CartInput!){cartCreate(input:$input){' +
    'cart{checkoutUrl lines(first:250){nodes{quantity merchandise{... on ProductVariant{id}}}}}' +
    'userErrors{message} warnings{message}}}';

  // Call this from the click itself. The checkout tab is opened right away, because a window
  // opened after a network round trip counts as a pop-up and gets blocked (Safari blocks it
  // outright); the tab is pointed at checkout once Shopify has the cart.
  function checkout(){
    if(!bag.length){ notify('Your bag is empty.'); return; }
    if(busy) return;
    busy = true;
    var win = null;
    try { win = window.open('', '_blank'); } catch(e){}
    if(win){
      try {
        win.document.write('<!doctype html><title>Checkout</title><p style="font:16px Arial,sans-serif;color:#2a3248;padding:32px">Opening secure checkout…</p>');
        win.document.close();
      } catch(e){}
    }
    var want = {};
    bag.forEach(function(it){ want[it.variantId] = (want[it.variantId] || 0) + it.qty; });
    var lines = bag.map(function(it){ return { merchandiseId: it.variantId, quantity: it.qty, attributes: it.attrs || [] }; });
    gql(CART_CREATE, { input: { lines: lines } }).then(function(d){
      var r = d.cartCreate, c = r && r.cart;
      if(!c || !c.checkoutUrl) throw new Error((r && r.userErrors && r.userErrors[0] && r.userErrors[0].message) || 'no checkout link');
      var got = {};
      c.lines.nodes.forEach(function(l){ var id = l.merchandise && l.merchandise.id; if(id) got[id] = (got[id] || 0) + l.quantity; });
      var trimmed = [];
      Object.keys(want).forEach(function(id){
        if((got[id] || 0) >= want[id]) return;
        // Shopify cut this line (sold out, or fewer left than asked). Make the bag say what
        // checkout would have said, and let the customer look before paying — never send them
        // to a checkout that quietly differs from the bag they were just shown.
        var left = got[id] || 0;
        bag.forEach(function(it){
          if(it.variantId !== id) return;
          var keep = Math.min(it.qty, left); left -= keep;
          if(keep < it.qty) trimmed.push(label(it) + (keep ? ': only ' + keep + ' left' : ': sold out'));
          it.qty = keep;
        });
      });
      if(trimmed.length){
        for(var j = bag.length - 1; j >= 0; j--) if(bag[j].qty <= 0) bag.splice(j, 1);
        changed();
        if(win) try { win.close(); } catch(e){}
        notify('Your bag was updated (' + trimmed.join('; ') + '). Check it, then press checkout again.', 9000);
        return;
      }
      if(win && !win.closed) win.location.replace(c.checkoutUrl);
      else window.location.href = c.checkoutUrl;
    }).catch(function(e){
      console.warn('[SHOP] checkout failed', e);
      if(win) try { win.close(); } catch(e2){}
      notify('Checkout couldn’t start. Check your connection and try again.', 7000);
    }).then(function(){ busy = false; });
  }

  // ── policies ───────────────────────────────────────────────────────────────
  // Read live, so a policy written in Shopify admin shows up here with no change to this file.
  var POLICIES = [
    { key: 'privacyPolicy',  label: 'Privacy',  url: PRIVACY_URL },
    { key: 'termsOfService', label: 'Terms',    url: '' },
    { key: 'refundPolicy',   label: 'Returns',  url: '' },
    { key: 'shippingPolicy', label: 'Shipping', url: '' }
  ];
  function loadPolicies(){
    gql('{shop{privacyPolicy{url} termsOfService{url} refundPolicy{url} shippingPolicy{url}}}').then(function(d){
      POLICIES.forEach(function(p){ var v = d.shop[p.key]; if(v && v.url) p.url = v.url; });
      renderLegal();
    }).catch(function(e){ console.warn('[SHOP] policy fetch failed', e); });
  }

  // ── DOM ────────────────────────────────────────────────────────────────────
  function h(tag, props, kids){
    var e = document.createElement(tag);
    if(props) for(var k in props){
      if(k === 'class') e.className = props[k];
      else if(k === 'text') e.textContent = props[k];
      else if(k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    }
    (kids || []).forEach(function(c){ if(c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  // The 3D page listens on window for pointer, touch, wheel and key events (the wheels, the
  // strip taps, the game keys). Nothing that happens inside SHOP's own elements may reach it:
  // a click on a link is not a click on the scene behind it.
  var ISOLATE = ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'mousemove', 'click',
    'touchstart', 'touchmove', 'touchend', 'wheel', 'keydown', 'keyup', 'keypress', 'contextmenu'];
  function isolate(e){
    ISOLATE.forEach(function(t){ e.addEventListener(t, function(ev){ ev.stopPropagation(); }, { passive: true }); });
  }

  function legalLinks(withStore){
    var out = [];
    if(withStore) out.push(h('button', { type: 'button', text: 'Text-only store', onclick: function(){ openStore(); } }));
    POLICIES.forEach(function(p){ if(p.url) out.push(h('a', { href: p.url, target: '_blank', rel: 'noopener', text: p.label })); });
    if(CONTACT_EMAIL) out.push(h('a', { href: 'mailto:' + CONTACT_EMAIL, text: 'Contact' }));
    return out;
  }
  function renderLegal(){
    if(ui.legal){ ui.legal.textContent = ''; legalLinks(true).forEach(function(n){ ui.legal.appendChild(n); }); }
    if(ui.storeLegal){
      ui.storeLegal.textContent = '';
      legalLinks(false).forEach(function(n){ ui.storeLegal.appendChild(n); });
      ui.storeLegal.appendChild(h('span', { text: '© ' + new Date().getFullYear() + ' Chrysolin' }));
    }
  }

  // The row is the page footer: it shows once the visitor has scrolled to the very end — the last
  // floor. Touch scrolling moves the camera target directly and never scrolls the document, so
  // the CAMERA is what's tested, not pageYOffset; the wheel/scrollbar path ends up there too
  // (onScroll maps the document onto the same range). When the 3D page can't start or stalls,
  // there is nothing to scroll, so the boot guard pins it up (noScene; stallPin lifts itself once
  // a slow page finally draws).
  var noScene = false, stallPin = false;
  function atBottom(){
    var w = window;
    if(noScene) return true;
    if(stallPin){
      if(w.renderer && w.renderer.info && w.renderer.info.render.frame > 0) stallPin = false;
      else return true;
    }
    if(typeof w.targetCameraY !== 'number' || typeof w.TOTAL_FLOORS !== 'number' || typeof w.FLOOR_SPACING !== 'number') return false;   // still loading
    return w.targetCameraY <= (w.STOREFRONT_MODEL ? w.STOREFRONT_MODEL.floorY(w.TOTAL_FLOORS-1) : -(w.TOTAL_FLOORS-1)*w.FLOOR_SPACING) + 0.3;
  }
  // ...and steps aside whenever the 3D page has something of its own on screen — the product
  // view, the bag, the menu, the lightbox, the game — so it never sits on top of their buttons.
  function sceneBusy(){
    try {
      var w = window;
      if(w.gameMode && w.gameMode.active) return true;
      if(w.dm && w.dm.active) return true;
      if(w.pdv && (w.pdv.active || w.pdv.entering)) return true;
      if(w.imgLightbox && (w.imgLightbox.active || w.imgLightbox.entering)) return true;
      if(w.navMenu && (w.navMenu.open || w.navMenu.barMode)) return true;
      if(w.cart && w.cart.panelOpen) return true;
    } catch(e){}
    return false;
  }

  function buildChrome(){
    ui.skip = h('a', { class: 'shop-skip', href: '#', text: 'Skip to the text-only store',
      onclick: function(e){ e.preventDefault(); openStore(); } });
    ui.legal = h('nav', { class: 'shop-legal', 'aria-label': 'Store information' });
    ui.toast = h('div', { class: 'shop-toast', role: 'status', 'aria-live': 'polite' });
    [ui.skip, ui.legal, ui.toast].forEach(isolate);
    document.body.insertBefore(ui.skip, document.body.firstChild);
    document.body.appendChild(ui.legal);
    document.body.appendChild(ui.toast);
    renderLegal();
    setInterval(function(){
      var on = atBottom() && !sceneBusy();
      if(ui.legal.classList.contains('on') !== on) ui.legal.classList.toggle('on', on);
    }, 200);
  }

  var toastTimer = 0;
  function notify(msg, ms){
    // Inside the open store the page behind is inert, so the message goes to the store's own
    // status line — a toast underneath a modal is neither seen nor read out.
    var t = (ui.store && ui.store.open) ? ui.storeStatus : ui.toast;
    if(!t) return;
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ ui.toast.classList.remove('on'); if(ui.storeStatus) ui.storeStatus.classList.remove('on'); }, ms || 4500);
  }

  // ── the text-only store ────────────────────────────────────────────────────
  // The whole shop as plain HTML: for screen readers and keyboards (the 3D page is one canvas
  // they cannot read), and for any device where the 3D page doesn't start. Same products, same
  // bag, same checkout.
  function buildStore(){
    if(ui.store) return;
    var d = h('dialog', { class: 'shop-store', 'aria-labelledby': 'shop-store-title' });
    ui.storeNote = h('p', { class: 'shop-note' });
    ui.storeNote.hidden = true;
    ui.storeStatus = h('p', { class: 'shop-status', role: 'status', 'aria-live': 'polite' });
    ui.storeList = h('div', { class: 'shop-list' });
    ui.bagBox = h('section', { class: 'shop-bag', 'aria-labelledby': 'shop-bag-title' });
    ui.storeLegal = h('footer', { class: 'shop-foot' });
    d.appendChild(h('div', { class: 'shop-in' }, [
      h('header', { class: 'shop-head' }, [
        h('h2', { id: 'shop-store-title', text: 'Chrysolin — text-only store' }),
        h('button', { type: 'button', class: 'shop-x', 'aria-label': 'Close the text-only store', text: '×', onclick: closeStore })
      ]),
      ui.storeStatus,
      h('div', { class: 'shop-scroll' }, [ui.storeNote, ui.storeList, ui.bagBox, ui.storeLegal])
    ]));
    d.addEventListener('close', function(){ document.documentElement.classList.remove('shop-open'); });
    d.addEventListener('click', function(e){ if(e.target === d) closeStore(); });   // the backdrop
    isolate(d);
    document.body.appendChild(d);
    ui.store = d;
    renderLegal();
  }
  function openStore(note){
    buildStore();
    ui.storeNote.hidden = !note;
    ui.storeNote.textContent = note || '';
    renderList();
    renderBag();
    document.documentElement.classList.add('shop-open');
    if(!ui.store.open){
      if(ui.store.showModal) ui.store.showModal(); else ui.store.setAttribute('open', '');
    }
  }
  function closeStore(){
    if(!ui.store) return;
    if(ui.store.close) ui.store.close(); else ui.store.removeAttribute('open');
    document.documentElement.classList.remove('shop-open');
  }

  function renderList(){
    var L = ui.storeList;
    L.textContent = '';
    if(!products){
      L.appendChild(h('p', { class: 'shop-muted', text: loadFailed ? 'The store couldn’t be reached.' : 'Loading the collection…' }));
      if(loadFailed) L.appendChild(h('button', { type: 'button', class: 'shop-btn2', text: 'Try again',
        onclick: function(){ loadFailed = false; renderList(); loadProducts(RETRY_MS.length); } }));
      return;
    }
    if(!products.length){ L.appendChild(h('p', { class: 'shop-muted', text: 'Nothing is listed right now.' })); return; }
    var order = [], groups = {};
    products.forEach(function(p){
      var t = p.productType || 'Collection';
      if(!groups[t]){ groups[t] = []; order.push(t); }
      groups[t].push(p);
    });
    order.forEach(function(t){
      L.appendChild(h('h3', { text: t }));
      groups[t].forEach(function(p){ L.appendChild(productCard(p)); });
    });
  }

  function productCard(p){
    var id = 'shop-p-' + (++uid);
    var vs = p.shopifyVariants || [];
    var info = [h('h4', { id: id, text: p.name })];
    var pl = priceLabel(p);
    if(pl) info.push(h('p', { class: 'shop-price', text: pl }));
    if(p.desc) info.push(h('p', { class: 'shop-desc', text: p.desc }));
    var sel = null;
    if(vs.length > 1){
      sel = h('select', { 'aria-label': 'Size for ' + p.name });
      var picked = false;
      vs.forEach(function(v){
        var o = h('option', { value: v.title, text: v.title + (v.available ? '' : ' — sold out') });
        if(!v.available) o.disabled = true;
        else if(!picked){ o.selected = true; picked = true; }
        sel.appendChild(o);
      });
      info.push(h('label', { class: 'shop-size' }, ['Size ', sel]));
    } else if(!p.sold && p.price > 0){
      sel = h('select', { 'aria-label': 'Size for ' + p.name });
      STAND_IN_SIZES.forEach(function(s){
        var o = h('option', { value: s, text: s });
        if(s === 'M') o.selected = true;
        sel.appendChild(o);
      });
      info.push(h('label', { class: 'shop-size' }, ['Size ', sel]));
    }
    var canBuy = !p.sold && p.price > 0;
    var btn = h('button', { type: 'button', class: 'shop-btn', 'aria-describedby': id,
      text: canBuy ? 'Add to bag' : (p.sold ? 'Sold out' : 'Not available') });
    if(!canBuy) btn.disabled = true;
    btn.addEventListener('click', function(){
      var r = add(p, sel ? sel.value : '');
      notify(r.ok ? 'Added ' + label(r.item) + ' to your bag.' : r.msg);
    });
    info.push(btn);
    var img = null;
    if(p.image){
      var src = p.image + (p.image.indexOf('?') < 0 ? '?' : '&') + 'width=240';
      img = h('img', { src: src, alt: p.imageAlts[0] || p.name, loading: 'lazy', width: '120', height: '120' });
    }
    return h('article', { class: 'shop-item', 'aria-labelledby': id }, [img, h('div', { class: 'shop-info' }, info)]);
  }

  function renderBag(){
    var B = ui.bagBox;
    // Re-rendering replaces the buttons, so put focus back on the one that was pressed.
    var keep = document.activeElement && B.contains(document.activeElement) ? document.activeElement.getAttribute('data-k') : null;
    B.textContent = '';
    var n = count();
    B.appendChild(h('h3', { id: 'shop-bag-title', tabindex: '-1', text: 'Your bag' + (n ? ' (' + n + ')' : '') }));
    if(!bag.length){
      B.appendChild(h('p', { class: 'shop-muted', text: 'Your bag is empty.' }));
      if(keep) B.firstChild.focus();
      return;
    }
    var ul = h('ul', { class: 'shop-lines' });
    bag.forEach(function(it, i){
      var name = label(it);
      ul.appendChild(h('li', null, [
        h('span', { class: 'shop-line-name', text: name }),
        h('span', { class: 'shop-qty' }, [
          h('button', { type: 'button', 'data-k': 'dec' + it.cartId, 'aria-label': 'One fewer ' + name, text: '−', onclick: function(){ setQty(i, it.qty - 1); } }),
          h('span', { text: String(it.qty) }),
          h('button', { type: 'button', 'data-k': 'inc' + it.cartId, 'aria-label': 'One more ' + name, text: '+', onclick: function(){ setQty(i, it.qty + 1); } })
        ]),
        h('span', { class: 'shop-line-price', text: money(it.price * it.qty, it.currency) }),
        h('button', { type: 'button', class: 'shop-link', 'data-k': 'rm' + it.cartId, 'aria-label': 'Remove ' + name, text: 'Remove',
          onclick: function(){ removeAt(i); } })
      ]));
    });
    B.appendChild(ul);
    B.appendChild(h('p', { class: 'shop-total' }, ['Subtotal ', h('strong', { text: money(subtotal(), bag[0].currency) })]));
    B.appendChild(h('p', { class: 'shop-muted', text: 'Shipping and taxes are calculated at checkout.' }));
    B.appendChild(h('button', { type: 'button', class: 'shop-btn', 'data-k': 'checkout', text: 'Checkout', onclick: checkout }));
    if(keep){
      var again = B.querySelector('[data-k="' + keep.replace(/"/g, '\\"') + '"]');
      (again || B.firstChild).focus();
    }
  }

  // The boot guard calls this when the 3D page can't start.
  function fallback(){
    noScene = true;   // nothing to scroll, so the footer stays up once the list is closed
    openStore('The 3D store couldn’t start on this device, so here is the collection as a list.');
  }
  // ...and this when it started but hasn't drawn yet: point at the list without forcing it.
  function stalled(){
    stallPin = true;
    notify('Taking a while? “Text-only store”, at the bottom, has the whole collection as a list.', 15000);
  }

  buildChrome();
  loadProducts(0);
  loadPolicies();

  return {
    bag: bag, subscribe: subscribe, onProducts: onProducts, products: function(){ return products; },
    add: add, addLine: addLine, removeAt: removeAt, setQty: setQty, count: count,
    priceLabel: priceLabel, money: money, variantFor: variantFor,
    checkout: checkout, notify: notify, openStore: openStore, closeStore: closeStore, fallback: fallback, stalled: stalled
  };
})();
</script>

     Both are fetched on demand instead; see loadLazyScript / ensurePeerJS / ensureTransformControls. -->

<script>
// ═══ VXT — THE VOLCANO TABLE ═══ (shared verbatim by the Forge packer in node and by the game: decode only there)
// A polar heightfield round the vent — NA azimuths × NR rings (the rings' radii listed, finest at the vent) — with the
// ground paint (4 u8 weights a node: ash · scoria · lava · vegetation; the rest is bare rock) and baked ambient
// occlusion (u8). Packed small: heights quantised to u16 steps, every channel written as zigzag varints of the deltas
// along each ring (the first of a ring against the ring before), runs of zeros squeezed to two bytes, then base64.
// Header: 'VXT1' · u32 JSON length · the JSON (NA, NR, rings, hMin, hStep, and what the exporter measured) · the streams.
var VXT = (function(){
  function W(){ this.b = []; }
  W.prototype.u8 = function(v){ this.b.push(v & 255); };
  W.prototype.u32 = function(v){ this.u8(v); this.u8(v >> 8); this.u8(v >> 16); this.u8(v >> 24); };
  W.prototype.varint = function(v){ v = v >>> 0; while(v >= 128){ this.u8((v & 127) | 128); v >>>= 7; } this.u8(v); };
  // a channel: ints in ring-major order → deltas → zigzag → varints, zero runs as [0, n]
  W.prototype.channel = function(vals, NA, NR){
    var run = 0, self = this;
    function flush(){ while(run > 0){ var n = Math.min(run, 255); self.u8(0); self.u8(n); run -= n; } }
    for(var i = 0; i < NR; i++) for(var j = 0; j < NA; j++){
      var k = i * NA + j, prev = j ? vals[k - 1] : (i ? vals[k - NA] : 0), d = vals[k] - prev, z = (d << 1) ^ (d >> 31);
      if(z === 0){ run++; continue; }
      flush(); this.varint(z);
    }
    flush();
  };
  function R(u8){ this.a = u8; this.p = 0; }
  R.prototype.u8 = function(){ return this.a[this.p++]; };
  R.prototype.u32 = function(){ var v = this.u8() | (this.u8() << 8) | (this.u8() << 16) | (this.u8() << 24); return v >>> 0; };
  R.prototype.varint = function(){ var v = 0, s = 0, b; do { b = this.u8(); v |= (b & 127) << s; s += 7; } while(b & 128); return v >>> 0; };
  R.prototype.channel = function(out, NA, NR){
    var n = NA * NR, k = 0, run = 0;
    while(k < n){
      var d = 0;
      if(run > 0) run--;
      else { var b = this.a[this.p]; if(b === 0){ this.p++; run = this.u8() - 1; } else { var z = this.varint(); d = (z >>> 1) ^ -(z & 1); } }
      var i = (k / NA) | 0, j = k - i * NA, prev = j ? out[k - 1] : (i ? out[k - NA] : 0);
      out[k] = prev + d; k++;
    }
    return out;
  };
  function b64enc(bytes){
    if(typeof Buffer !== 'undefined') return Buffer.from(bytes).toString('base64');
    var s = ''; for(var i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s);
  }
  function b64dec(str){
    if(typeof Buffer !== 'undefined') return new Uint8Array(Buffer.from(str, 'base64'));
    var bin = atob(str), u = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u;
  }
  function utf8(s){ if(typeof Buffer !== 'undefined') return new Uint8Array(Buffer.from(s, 'utf8')); return new TextEncoder().encode(s); }
  function unutf8(u){ if(typeof Buffer !== 'undefined') return Buffer.from(u).toString('utf8'); return new TextDecoder().decode(u); }
  // T: { NA, NR, rings: [NR radii], h: Float32Array(NA·NR), w: Uint8Array(NA·NR·4), ao: Uint8Array(NA·NR), meta: {} }
  function encode(T){
    var NA = T.NA, NR = T.NR, n = NA * NR, i, c;
    var hMin = Infinity, hMax = -Infinity;
    for(i = 0; i < n; i++){ if(T.h[i] < hMin) hMin = T.h[i]; if(T.h[i] > hMax) hMax = T.h[i]; }
    var hStep = Math.max(1e-6, (hMax - hMin) / 65000), q = new Int32Array(n);
    for(i = 0; i < n; i++) q[i] = Math.round((T.h[i] - hMin) / hStep);
    var meta = Object.assign({}, T.meta || {}, { v: 1, NA: NA, NR: NR, rings: Array.prototype.slice.call(T.rings).map(function(r){ return +r.toFixed(3); }), hMin: hMin, hStep: hStep });
    var js = utf8(JSON.stringify(meta)), w = new W();
    w.u8(86); w.u8(88); w.u8(84); w.u8(49);   // 'VXT1'
    w.u32(js.length); for(i = 0; i < js.length; i++) w.u8(js[i]);
    w.channel(q, NA, NR);
    var ch = new Int32Array(n);
    for(c = 0; c < 4; c++){ for(i = 0; i < n; i++) ch[i] = T.w[i * 4 + c]; w.channel(ch, NA, NR); }
    for(i = 0; i < n; i++) ch[i] = T.ao[i]; w.channel(ch, NA, NR);
    var bytes = new Uint8Array(w.b);
    return { b64: b64enc(bytes), bytes: bytes.length, meta: meta };
  }
  function decode(b64){
    var u = b64dec(b64), r = new R(u);
    if(r.u8() !== 86 || r.u8() !== 88 || r.u8() !== 84 || r.u8() !== 49) throw new Error('VXT: bad magic');
    var jl = r.u32(), meta = JSON.parse(unutf8(u.subarray(r.p, r.p + jl))); r.p += jl;
    var NA = meta.NA, NR = meta.NR, n = NA * NR, i, c;
    var q = r.channel(new Int32Array(n), NA, NR), h = new Float32Array(n);
    for(i = 0; i < n; i++) h[i] = meta.hMin + q[i] * meta.hStep;
    var w = new Uint8Array(n * 4), ch = new Int32Array(n);
    for(c = 0; c < 4; c++){ r.channel(ch, NA, NR); for(i = 0; i < n; i++) w[i * 4 + c] = ch[i]; }
    r.channel(ch, NA, NR); var ao = new Uint8Array(n); for(i = 0; i < n; i++) ao[i] = ch[i];
    return { NA: NA, NR: NR, rings: new Float32Array(meta.rings), h: h, w: w, ao: ao, meta: meta };
  }
  // ── sampling a decoded table (the game's mtnRaw uses this): bilinear in (ring, azimuth), data azimuth = atan2(z, x) ──
  // tri: sample the TRIANGULATED surface (the mesh's own split: a·b·c / b·d·c per cell) instead of bilinear — what the
  // runner rides on must be the very surface drawn
  function sampler(T, tri){
    var NA = T.NA, NR = T.NR, rg = T.rings, h = T.h, rMax = rg[NR - 1], TAU = Math.PI * 2;
    var ringOf = new Float32Array(Math.ceil(rMax) + 2);   // r (whole units) → ring index + fraction, by lookup
    var k = 0;
    for(var r = 0; r < ringOf.length; r++){ while(k + 1 < NR && rg[k + 1] <= r) k++; var a = rg[k], b = rg[Math.min(k + 1, NR - 1)]; ringOf[r] = k + (b > a ? Math.min(1, (r - a) / (b - a)) : 0); }
    function at(x, z, chan){   // chan: undefined = height; 0..3 = paint weight (0..1); 4 = ao (0..1)
      var r = Math.sqrt(x * x + z * z), src = chan == null ? h : null;
      var fi, i0, ti;
      if(r >= rMax){ i0 = NR - 2; ti = 1; }
      else { var ri = Math.floor(r), f0 = ringOf[ri], f1 = ringOf[ri + 1]; fi = f0 + (f1 - f0) * (r - ri); i0 = Math.min(NR - 2, Math.floor(fi)); ti = fi - i0; }
