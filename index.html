  cz.segs.push({id:step.id, thumb:thumb, target:target, segs:segs});
  return grp;
}

function buildCell(step, val, w, h, selected, enabled, g){
  var grp = new THREE.Group();
  grp.add(czGlassPanel(w, h, selected ? 'cellOn' : (enabled ? 'cell' : 'cellOff')));
  // Marked on the GROUP, not the backing plate, so a click anywhere in the cell
  // — the swatch, the thumbnail, the caption — resolves to the same action.
  if(enabled) mkClickable(grp, 'cz-set-' + step.id + '-' + val.v);

  if(step.type === 'swatch' && val.hex){
    var sw = new THREE.Mesh(
      new THREE.PlaneGeometry(w*0.62, h*0.46),
      new THREE.MeshBasicMaterial({color:new THREE.Color(val.hex), transparent:true,
                                   opacity: enabled ? 1 : 0.4, depthWrite:false, depthTest:false})
    );
    sw.renderOrder = 21;
    sw.position.set(0, h*0.14, 0.02);
    grp.add(sw);
    grp.add(posd(czLabel(val.v, w*0.9, h*0.24,
          {frac:0.72, color: enabled ? '#3a4258' : '#a9afbe'}), 0, -h*0.30, 0.03));
  }
  else if(step.type === 'thumb'){
    if(val.none){
      grp.add(posd(czLabel('NONE', w*0.9, h*0.26,
            {frac:0.74, weight:'500', color:'#6b7488'}), 0, 0, 0.03));
    } else {
      // Thumbnails render the same art the compositor uses, on the current base,
      // so a swatch can never disagree with the garment.
      var ink = inkFor(g.config.base, g.data);
      var baseVal = findValue(findStep(g.data,'base'), g.config.base);
      var c = document.createElement('canvas'); c.width = c.height = 192;
      var ctx = c.getContext('2d');
      ctx.fillStyle = baseVal ? baseVal.hex : '#888';
      ctx.fillRect(0,0,192,192);
      ctx.drawImage(artCanvas(val.art, ink, 512), 14, 14, 164, 164);
      var th = new THREE.Mesh(
        new THREE.PlaneGeometry(w*0.70, w*0.70),
        new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true,
                                     opacity: enabled ? 1 : 0.4, depthWrite:false, depthTest:false})
      );
      th.renderOrder = 21;
      th.position.set(0, h*0.12, 0.02);
      grp.add(th);
      grp.add(posd(czLabel(val.v, w*0.96, h*0.19,
            {frac:0.74, weight:'400', color: enabled ? '#5a6478' : '#a9afbe'}),
            0, -h*0.36, 0.03));
    }
  }
  else {
    grp.add(posd(czLabel(val.v, w*0.9, h*0.46,
          {frac:0.76, weight: selected ? '600' : '400',
           color: enabled ? (selected ? '#232a3c' : '#5a6478') : '#b3b9c7'}), 0, 0, 0.03));
  }
  return grp;
}
function posd(m, x, y, z){ m.position.set(x, y, z); return m; }

// ═══════════════════════════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════════════════════════
var _ray = new THREE.Raycaster(), _m = new THREE.Vector2();
// Raycaster.params.Line.threshold defaults to ONE WORLD UNIT — a line counts as
// hit whenever the ray passes within a full unit of it. With decorative rim
// outlines parented to clickable panels, that made every button in the UI
// misfire: the nearest "hit" at any click point was some other cell's outline,
// and walking up from it resolved to that cell. Measured: 0 of 31 buttons
// firing correctly, while the UI looked perfectly fine.
//
// Three defences, because this failure mode is completely silent:
//   1. the thresholds, shrunk to a hair (here)
//   2. decorative lines given a no-op raycast (czGlassPanel)
//   3. only Meshes treated as interactive (below)
_ray.params.Line.threshold = 0.001;
_ray.params.Points.threshold = 0.001;

function pick(cx, cy, objs, cam){
  _m.x = (cx/window.innerWidth)*2 - 1;
  _m.y = -(cy/window.innerHeight)*2 + 1;
  _ray.setFromCamera(_m, cam || cz.host.camera);
  var hits = _ray.intersectObjects(objs, true), out = [];
  for(var i=0;i<hits.length;i++) if(hits[i].object.isMesh) out.push(hits[i]);
  return out;
}

// Screen pixel -> overlay coordinates. The overlay is centred on the viewport
// with +y up, so this is a straight remap with no projection involved.
function toOverlay(cx, cy){
  return {x: cx - window.innerWidth/2, y: window.innerHeight/2 - cy};
}

function garmentUnder(cx, cy){
  if(!cz.stage || !cz.stage.visible) return null;
  var hits = pick(cx, cy, cz.stage.children);
  for(var i=0;i<hits.length;i++){
    var o = hits[i].object;
    while(o){
      if(o.userData.czGarmentIndex !== undefined) return cz.garments[o.userData.czGarmentIndex];
      o = o.parent;
    }
  }
  return null;
}

// Returns the actionId under the point, 'panel' if the UI was hit but nothing
// actionable, or null if the pointer missed the UI entirely. That last case is
// what opens the door to an orbit drag.
// Clipping planes clip RENDERING, not raycasts. A row scrolled out of the
// viewport is invisible but still fully hit-testable, and since the pinned
// footer sits below the viewport those ghost rows were swallowing clicks meant
// for ADD TO CART. Hits inside the scroll group are therefore re-tested against
// the same bounds the shader clips to.
var _hitLocal = new THREE.Vector3();
function hitClippedOut(hit){
  if(!cz.scrollGroup || cz.scroll.viewTop === undefined) return false;
  var o = hit.object, inScroll = false;
  while(o){ if(o === cz.scrollGroup){ inScroll = true; break; } o = o.parent; }
  if(!inScroll) return false;
  _hitLocal.copy(hit.point);
  cz.ui.worldToLocal(_hitLocal);
  return _hitLocal.y > cz.scroll.viewTop || _hitLocal.y < cz.scroll.viewBot;
}

function uiHitAt(cx, cy){
  if(!cz.ui) return null;
  var hits = pick(cx, cy, cz.ui.children, cz.host.overlay().camera);
  if(!hits.length) return null;
  for(var i=0;i<hits.length;i++){
    if(hitClippedOut(hits[i])) continue;
    var o = hits[i].object;
    while(o && o !== cz.ui){
      if(o.userData.clickable && o.userData.actionId) return o.userData.actionId;
      o = o.parent;
    }
  }
  return 'panel';
}

function onPointerMove(cx, cy, shift){
  if(uiInteractive()){
    if(cz.drag){
      var dx = cx - cz.drag.lastX, dy = cy - cz.drag.lastY;
      cz.drag.lastX = cx; cz.drag.lastY = cy;
      cz.drag.moved += Math.abs(dx) + Math.abs(dy);
      if(cz.drag.mode === 'scroll'){
        // 1:1 with the finger, and NEGATED: dragging up moves the content up,
        // which reveals what is below it. scroll.y increasing means "further
        // down the list", so an upward drag (dy negative) must increase it.
        var L = layout();
        var d = -dy;   // pixels, 1:1 with the cursor
        scrollBy(d);
        cz.scroll.vel = d;
      } else {
        applyDrag(dx, dy, shift ? 'pan' : cz.drag.mode);
      }
      return true;
    }
    // A press that turns into a drag is a drag, not a click. Without this any
    // slip while pressing a swatch would still commit the option — and on touch
    // it would make the list impossible to scroll, since every scroll gesture
    // starts on top of a cell.
    if(cz.press){
      var pdx = cx - cz.press.x, pdy = cy - cz.press.y;
      cz.press.moved += Math.abs(pdx) + Math.abs(pdy);
      cz.press.x = cx; cz.press.y = cy;
      if(cz.press.moved > 10){
        var wasInScroll = cz.press.inScroll;
        cz.press = null;
        if(wasInScroll && cz.scroll.max > 0){
          cz.drag = {mode:'scroll', lastX:cx, lastY:cy, moved:0};
          cz.scroll.vel = 0;
        }
      }
    }
    return false;
  }
  if(cz.phase !== 'idle' && cz.phase !== 'focused') return false;
  var g = garmentUnder(cx, cy);
  cz.hovered = g;
  cz.phase = g ? 'focused' : 'idle';
  return !!g;
}

function applyDrag(dx, dy, mode){
  var g = cz.active, V = cz.view;
  if(!g) return;
  V.touched = true;
  if(mode === 'pan'){
    var L = layout();
    // 1:1 with the cursor, and the leash grows with zoom — the whole reason to
    // pan is to reach a detail you have zoomed into, so a fixed limit would
    // strand you exactly when you need it most.
    var lim = VIEW_LIM.pan * V.zoom;
    V.panX = clamp(V.panX + (dx/window.innerWidth) * L.halfW * 2, -lim, lim);
    V.panY = clamp(V.panY - (dy/window.innerHeight) * L.halfH * 2, -lim, lim);
    return;
  }
  // Yaw goes straight into g.spin so the design-step auto-turn absorbs it
  // rather than layering on top of a separate user offset.
  var dYaw = (dx/window.innerWidth) * Math.PI * 2.5;
  var dPitch = (dy/window.innerHeight) * Math.PI * 1.3;
  g.spin += dYaw;
  V.pitch = clamp(V.pitch + dPitch, -VIEW_LIM.pitch, VIEW_LIM.pitch);
  g.faceTarget = null;                 // the user is steering now
  V.velYaw   = dYaw   / Math.max(1/120, 1/60);
  V.velPitch = dPitch / Math.max(1/120, 1/60);
}

function applyZoom(factor, atY){
  if(cz.phase !== 'config') return;
  var V = cz.view;
  V.touched = true;
  V.zoom = clamp(V.zoom * factor, VIEW_LIM.zoomMin, VIEW_LIM.zoomMax);
}

// The garment is parked off to one side of its page, so it sits ~24 degrees off
// the camera axis. Facing +Z would therefore present it turned away from the
// viewer. Every "face forward" target adds this, computed live so it stays right
// across layouts, aspect ratios and both the left and right pages.
function parallaxYaw(g){
  var wp = new THREE.Vector3();
  g.pivot.getWorldPosition(wp);
  var cam = cz.host.camera.position;
  return Math.atan2(cam.x - wp.x, cam.z - wp.z);
}

// The angle that shows `face`, expressed as the representative NEAREST to where
// the garment already is.
//
// The previous version rounded the current spin to a whole turn and added the
// face offset, which meant switching between two back designs — already looking
// at the back — computed a target a full 2*PI away and span the garment right
// round for no reason. Picking the nearest equivalent angle means an unchanged
// facing costs exactly zero rotation, and any real change takes the short way.
function faceAngle(g, face){
  var want = parallaxYaw(g) + (face === 'back' ? Math.PI : 0);
  var k = Math.round((g.spin - want) / (Math.PI*2));
  return want + k * Math.PI*2;
}

function resetView(){
  cz.view = defaultView();
  if(cz.active){
    cz.active.faceTarget = faceAngle(cz.active, 'front');
  }
}

// Is this screen point inside the scrolling region of the panel (as opposed to
// the pinned header/footer)? Decides whether a wheel scrolls or zooms, and
// whether a drag on the panel scrolls or does nothing.
// Pure pixel arithmetic now — no projection round-trip, because the overlay is
// the screen.
function inScrollArea(cx, cy){
  if(!cz.ui || cz.scroll.viewTop === undefined) return false;
  if(!uiHitAt(cx, cy)) return false;              // not over the panel at all
  var p = toOverlay(cx, cy);
  var y = p.y - cz.ui.position.y;
  return y <= cz.scroll.viewTop && y >= cz.scroll.viewBot;
}

// The panel finishes sliding in well before the camera finishes travelling, so
// there is a stretch where it looks completely settled while the phase is still
// 'transition'. Gating interaction on the phase made every click in that window
// silently do nothing. If it looks ready, it is ready.
function uiInteractive(){ return !!cz.ui && cz.uiSlide.t >= 1; }

function onPointerDown(cx, cy, shift){
  if(uiInteractive()){
    var aid = uiHitAt(cx, cy);
    if(aid && aid !== 'panel'){
      // Committed on release, not here — see onPointerUp.
      cz.press = {aid:aid, x:cx, y:cy, moved:0, inScroll:inScrollArea(cx, cy)};
      return true;
    }
    if(aid === 'panel'){
      // Empty space inside the panel: drag scrolls the list, never orbits.
      if(inScrollArea(cx, cy) && cz.scroll.max > 0){
        cz.drag = {mode:'scroll', lastX:cx, lastY:cy, moved:0};
        cz.scroll.vel = 0;
      }
      return true;
    }
    // Off the panel. Inspecting the garment is only safe once the page has
    // arrived — during the transition its spin is driven by the entrance.
    if(cz.phase === 'config'){
      cz.drag = {mode: shift ? 'pan' : 'orbit', lastX:cx, lastY:cy, moved:0};
      cz.view.velYaw = 0; cz.view.velPitch = 0;
    }
    return true;
  }
  if(cz.phase === 'config' || cz.phase === 'transition') return true;   // swallow

  var g = garmentUnder(cx, cy);
  if(!g) return false;

  // Touch has no hover, so the focus state has to be earned by a first tap:
  // tap once to focus, tap again to enter. On mouse, hover already focused it.
  if(cz.hovered !== g){
    cz.hovered = g;
    cz.phase = 'focused';
    return true;
  }
  enterGarment(g);
  return true;
}

function onPointerUp(){
  if(cz.press){
    if(cz.press.moved <= 10) handleAction(cz.press.aid);
    cz.press = null;
  }
  cz.drag = null;
  cz.pinch = null;
  return true;
}

function handleAction(aid){
  cz.lastAction = aid;
  var g = cz.active;
  if(!g) return;
  if(aid === 'cz-back'){ exitToStage(); return; }
  if(aid === 'cz-reset'){ resetView(); return; }
  if(aid === 'cz-add'){ czCartAdd(g.data, g.config); return; }
  if(aid.indexOf('cz-set-') === 0){
    var rest = aid.slice(7);
    var dash = rest.indexOf('-');
    var stepId = rest.slice(0, dash), value = rest.slice(dash+1);
    if(g.config[stepId] === value) return;
    g.config[stepId] = value;

    // The texture updates in place — redraw, cross-fade, done. No mesh churn and
    // no scene rebuild, which is the main departure from the product detail view.
    g.comp.crossfadeTo(g.config, OPT_XFADE_MS);

    // Turn the garment to the face this step prints on, so you are looking at
    // what you are choosing.
    var step = findStep(g.data, stepId);
    if(step && step.face) g.faceTarget = faceAngle(g, step.face);
    buildConfigUI(g);     // only the UI rebuilds
  }
}

function enterGarment(g){
  cz.active = g;
  cz.hovered = g;
  cz.phase = 'transition';
  cz.transT = 0;
  cz.view = defaultView();
  cz.drag = null; cz.press = null; cz.pinch = null;
  cz.segPos = {};              // thumbs start where the new garment's config is
  destroyConfigUI();   // a panel still sliding out must not be adopted
  cz.uiSlide = {t:0, target:1, dist:0, dur:0.42};
  // Whatever combination was showing becomes the starting config — the idle
  // loop is merchandising, not decoration.
  g.spinStart = Math.round(g.spin / (Math.PI*2)) * Math.PI*2;
  g.comp.setImmediate(g.config);
  g.setMix(0);
  cz.camTargetX = g.pageX;
}

function exitToStage(){
  // Slides back out rather than vanishing. The UI is left alive and the update
  // loop disposes it once it has cleared the edge — tearing it down here would
  // mean there was nothing left to animate.
  if(cz.ui){ cz.uiSlide.target = 0; cz.uiSlide.dur = 0.26; }
  if(cz.active){
    cz.active.faceTarget = null;
    cz.active.showcaseT = 0;
    cz.active.pivot.rotation.set(0, cz.active.spin, 0);   // drop any inspect pitch
  }
  cz.active = null;
  cz.hovered = null;
  cz.phase = 'idle';
  cz.camTargetX = 0;
  cz.view = defaultView();
  cz.drag = null; cz.press = null; cz.pinch = null;
}

function enterFromCode(code){
  var d = decodeConfig(code);
  if(!d) return false;
  for(var i=0;i<cz.garments.length;i++){
    if(cz.garments[i].data === d.garment){
      var g = cz.garments[i];
      g.config = d.config;
      g.comp.setImmediate(g.config);
      g.setMix(0);
      cz.host.camera.position.y = CZ_STAGE_Y;
      enterGarment(g);
      cz.transT = 1;       // land immediately rather than replaying the entrance
      return true;
    }
  }
  return false;
}

// ═══════════════════════════════════════════════════════════════════════════
// PUBLIC SURFACE — the only things the site calls
// ═══════════════════════════════════════════════════════════════════════════
return {
  STAGE_Y: CZ_STAGE_Y,
  init: function(host){
    cz.host = host;
    cz.view = defaultView();
    buildStage();
    cz.ready = true;
    var m = /[?&]cz=([^&]+)/.exec(location.search);
    if(m) cz.pendingCode = decodeURIComponent(m[1]);
  },
  start: function(){
    if(cz.pendingCode){ enterFromCode(cz.pendingCode); cz.pendingCode = null; }
  },
  update: update,
  onPointerMove: onPointerMove,
  onPointerDown: onPointerDown,
  onPointerUp: onPointerUp,
  // Wheel/pinch zoom. Returns true when it consumed the gesture, so the host
  // knows not to also scroll the page with it.
  // The wheel means "scroll" over the option list and "zoom" over the garment.
  // Needs the pointer position to tell those apart, which is why the harness
  // tracks the last cursor location and passes it through.
  onWheel: function(deltaY, cx, cy){
    // Scrolling the list is allowed as soon as the panel has settled; zooming
    // the garment waits for the page to arrive.
    if(uiInteractive() && cx !== undefined && inScrollArea(cx, cy)){
      // Wheel down (deltaY positive) goes further down the list, as everywhere.
      var L = layout();
      return scrollBy(deltaY * 1.1);
    }
    if(cz.phase !== 'config') return false;
    applyZoom(Math.exp(-deltaY * 0.0014));
    return true;
  },
  // Two fingers pinch to zoom and drag their midpoint to pan, in one gesture —
  // which is what people already expect from every map and photo viewer.
  onPinch: function(dist, midX, midY){
    if(cz.phase !== 'config') return false;
    if(cz.pinch === null){
      cz.pinch = {dist:dist, zoom0:cz.view.zoom, midX:midX, midY:midY};
      cz.drag = null; cz.press = null;
      return true;
    }
    cz.view.zoom = clamp(cz.pinch.zoom0 * (dist / cz.pinch.dist),
                         VIEW_LIM.zoomMin, VIEW_LIM.zoomMax);
    applyDrag(midX - cz.pinch.midX, midY - cz.pinch.midY, 'pan');
    cz.pinch.midX = midX; cz.pinch.midY = midY;
    return true;
  },
  resetView: resetView,
  // ── glass plumbing: the host renders the background snapshot, CZ says when
  //    to hide its glass and feeds the result back into the shaders ──
  hasGlass: function(){ return !!cz.ui; },
  // Toggled around the backdrop snapshot. No phase check: the panel also has to
  // hide itself from that pass while it is sliding OUT, which happens after the
  // phase has already returned to 'idle'.
  setGlassVisible: function(v){ if(cz.ui) cz.ui.visible = v; },
  updateGlassUniforms: function(tex, time, pxW, pxH){
    if(!cz.ui) return;
    cz.ui.traverse(function(c){
      if(!c.material || !c.material.uniforms) return;
      var u = c.material.uniforms;
      if(u.tBlur) u.tBlur.value = tex;
      if(u.time) u.time.value = time;
      if(u.resolution) u.resolution.value.set(pxW, pxH);
    });
  },
  scrollBy: scrollBy,
  _inScrollArea: inScrollArea,
  onResize: function(){
    var p = czPortrait();
    if(p !== cz.lastPortrait){
      cz.lastPortrait = p;
      if(cz.phase === 'config' && cz.active) buildConfigUI(cz.active);
    }
  },
  // Straight entry without a raycast — used by the harness shortcuts, and by the
  // site when a ?cz= link names a garment.
  enterGarmentByIndex: function(i){
    var g = cz.garments[i];
    if(!g || cz.phase === 'transition' || cz.phase === 'config') return false;
    enterGarment(g);
    return true;
  },
  // The site consults this in onScroll() to pin the page, the same way the image
  // lightbox already does.
  isLockingScroll: function(){ return cz.phase === 'transition' || cz.phase === 'config'; },
  exitToStage: exitToStage,
  enterFromCode: enterFromCode,
  // exposed for verification
  _resolveVariant: resolveVariant,
  _encode: encodeConfig,
  _decode: decodeConfig,
  _handleAction: handleAction,
  _layout: layout,
  _buildUI: buildConfigUI,
  _uiHitAt: uiHitAt,
  _state: cz
};
})();


// ═══════════════════════════════════════════════════════════════════════════════
// BOOT — harness only
// ═══════════════════════════════════════════════════════════════════════════════
var hudEl = document.getElementById('hud');
var flashMsg = '', flashT = 0;
function hudFlash(m){ flashMsg = m; flashT = 2.2; }

var fakeScrollY = 0;
var CAM_Z_HOST = 4.5;

function boot(){
  initHost();

  CZ.init({
    scene: scene,
    camera: camera,
    renderer: renderer,
    // CZ supplies bevel geometry; the host supplies the glass material and the
    // type. Both are the site's own — at port time these two slots point at
    // createGlassShaderMaterial and pdvTextMesh directly.
    ui: { textMesh: stubTextMesh, glassMaterial: createGlassShaderMaterial },
    // The UI lives in its own screen-space pass, not in the 3D scene.
    overlay: function(){ return {scene: czOverlayScene, camera: czOverlayCamera}; },
    shopify: fakeShopify,
    isPortrait: isPortrait,        // harness needs the forced-portrait override
    notify: hudFlash
  });

  camera.position.set(0, CZ.STAGE_Y, CAM_Z_HOST);
  camera.lookAt(0, CZ.STAGE_Y, 0);
  fakeScrollY = CZ.STAGE_Y;

  CZ.start();
  bindInput();
  animate();
}

function bindInput(){
  var el = renderer.domElement;

  el.addEventListener('mousedown', function(e){
    CZ.onPointerDown(e.clientX, e.clientY, e.shiftKey || e.button === 2);
  });
  // Move and up go on WINDOW, not the canvas: a drag that leaves the canvas (or
  // releases outside it) must still track and still end, or the model sticks to
  // the cursor forever.
  window.addEventListener('mousemove', function(e){
    CZ.onPointerMove(e.clientX, e.clientY, e.shiftKey || (e.buttons & 2) !== 0);
  });
  window.addEventListener('mouseup', function(){ CZ.onPointerUp(); });
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });  // right-drag = pan
  el.addEventListener('dblclick', function(){ CZ.resetView(); });

  function twoFinger(e){
    var a = e.touches[0], b = e.touches[1];
    return CZ.onPinch(Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
                      (a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2);
  }

  el.addEventListener('touchstart', function(e){
    if(e.touches.length === 2){ if(twoFinger(e)) e.preventDefault(); return; }
    var t = e.changedTouches[0];
    if(CZ.onPointerDown(t.clientX, t.clientY, false)) e.preventDefault();
  }, {passive:false});

  el.addEventListener('touchmove', function(e){
    if(e.touches.length === 2){ if(twoFinger(e)) e.preventDefault(); return; }
    // Only forward single-finger movement while the customizer owns the screen.
    // On the stage there is no hover on touch, and feeding moves into the hover
    // path would break the tap-to-focus-then-tap-to-enter flow.
    if(!CZ.isLockingScroll()) return;
    var t = e.changedTouches[0];
    if(CZ.onPointerMove(t.clientX, t.clientY, false)) e.preventDefault();
  }, {passive:false});

  el.addEventListener('touchend', function(){ CZ.onPointerUp(); });
  el.addEventListener('touchcancel', function(){ CZ.onPointerUp(); });

  window.addEventListener('wheel', function(e){
    // Position matters: the wheel scrolls the option list when the cursor is
    // over it, and zooms the garment otherwise.
    if(CZ.onWheel(e.deltaY, e.clientX, e.clientY)) return;
    if(CZ.isLockingScroll()) return;             // the scroll lock, proven
    fakeScrollY -= e.deltaY * 0.004;
    fakeScrollY = Math.max(-(3*FLOOR_SPACING), Math.min(CZ.STAGE_Y, fakeScrollY));
  }, {passive:true});

  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape') CZ.exitToStage();
    if(e.key === '1' || e.key === '2'){
      fakeScrollY = CZ.STAGE_Y;
      camera.position.y = CZ.STAGE_Y;
      CZ.enterGarmentByIndex(e.key === '1' ? 0 : 1);
    }
    if(e.key === 'p' || e.key === 'P'){ forcePortrait = !forcePortrait; CZ.onResize(); }
    if(e.key === 'r' || e.key === 'R'){ CZ.resetView(); }
    if(e.key === 'h' || e.key === 'H'){
      var on = hudEl.style.display === 'block';
      hudEl.style.display = on ? 'none' : 'block';
      document.getElementById('help').style.display = on ? 'none' : 'block';
    }
    if(e.key === 'c' || e.key === 'C'){
      var a = CZ._state.active;
      if(a){
        var link = location.origin + location.pathname + '?cz=' + CZ._encode(a.data, a.config);
        console.log(link);
        hudFlash('config link logged to console');
      }
    }
  });
}

var fpsT = 0, fpsN = 0, fps = 0;
function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);

  if(!CZ.isLockingScroll()){
    camera.position.y += (fakeScrollY - camera.position.y) * Math.min(1, dt*6);
  }
  CZ.update(dt);
  camera.lookAt(camera.position.x, camera.position.y, 0);

  // Glass refracts a snapshot of the scene WITHOUT itself in it — otherwise it
  // would sample its own previous frame and smear. Same two-pass structure the
  // site already runs for the cart window, so at port time CZ simply rides the
  // site's existing pass instead of adding one.
  if(glassFBO && CZ.hasGlass()){
    CZ.setGlassVisible(false);
    renderer.setRenderTarget(glassFBO);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    CZ.setGlassVisible(true);
    var blurred = renderBackdropBlur(glassFBO.texture, 3);
    CZ.updateGlassUniforms(blurred, performance.now()*0.001,
                           window.innerWidth * renderer.getPixelRatio(),
                           window.innerHeight * renderer.getPixelRatio());
  }

  renderer.render(scene, camera);

  // Overlay pass: depth cleared first, so the UI is unconditionally on top.
  if(czOverlayScene && CZ.hasGlass()){
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(czOverlayScene, czOverlayCamera);
    renderer.autoClear = true;
  }

  fpsT += dt; fpsN++;
  if(fpsT >= 0.5){ fps = Math.round(fpsN/fpsT); fpsT = 0; fpsN = 0; }
  if(flashT > 0) flashT -= dt;
  drawHud();
}

function drawHud(){
  var s = CZ._state;
  var a = s.active;
  var lines = [
    '<b>phase</b>  ' + s.phase + '        <b>fps</b> ' + fps,
    '<b>portrait</b> ' + (isPortrait() ? 'yes' : 'no') + '   <b>scrollLock</b> ' + (CZ.isLockingScroll()?'ON':'off'),
    '<b>camera</b> x=' + camera.position.x.toFixed(2) + ' y=' + camera.position.y.toFixed(2)
  ];
  if(a){
    lines.push('<b>garment</b> ' + a.data.title);
    var cfgs = [];
    a.data.steps.forEach(function(st){ cfgs.push(st.id + '=' + a.config[st.id]); });
    lines.push('<b>config</b>  ' + cfgs.join('  '));
    lines.push('<b>code</b>    ' + CZ._encode(a.data, a.config));
    var prod = fakeShopify.byHandle(a.data.shopifyHandle);
    var sel = {}; a.data.steps.forEach(function(st){ if(st.option) sel[st.option] = a.config[st.id]; });
    var v = CZ._resolveVariant(prod, sel);
    lines.push('<b>variant</b> ' + (v ? v.title + (v.available===false?'  SOLD OUT':'  ok') : 'NONE RESOLVED'));
  }
  lines.push('<b>cart</b>    ' + fakeShopify.lines.length + ' line(s)');
  if(flashT > 0) lines.push('<b>» ' + flashMsg + '</b>');
  hudEl.innerHTML = lines.join('\n');
}

boot();
</script>
</body>
</html>
