d<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>

  #hud{position:fixed;left:10px;top:10px;z-index:10;font:11px/1.5 monospace;color:#3a4258;

       padding:8px 10px;pointer-events:none;white-space:pre;max-width:46vw;}

        padding:8px 10px;pointer-events:none;white-space:pre;}

<body>
<div id="canvas-container"></div>
<div id="hud"></div>
<div id="help">1 / 2    enter tee / jeans
ESC      back to stage
P        toggle portrait sim

IN CONFIG VIEW

shift or

       2 fingers pinch + pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════════
// CHRYSOLIN CUSTOMIZER — PREVIEW HARNESS
// ═══════════════════════════════════════════════════════════════════════════════
// Preview-first, the way the lava work was built. Everything below the HOST STUB
// divider is the real deliverable and ports into `Chrysolin Website.html` as one
// IIFE; everything above it is a stand-in for things the site already has.
//
// The porting contract is deliberately narrow — CZ touches the host only through
// the `host` object handed to CZ.init(). In the site those slots are filled with
// the real scene/camera plus createPdvGlassPanel / pdvTextMesh / gameUIButton and
// the real Shopify cart, and nothing inside CZ changes.
// ═══════════════════════════════════════════════════════════════════════════════


// ═══════════════════════════════════════════════════════════════════════════════
// HOST STUB — stands in for Chrysolin Website.html. NOT ported.
// ═══════════════════════════════════════════════════════════════════════════════
var scene, camera, renderer, clock;
var FLOOR_SPACING = 6.5;          // matches the site
var forcePortrait = false;

function initHost(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0.941, 0.941, 0.961);   // site bg

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
  renderer.sortObjects = true;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // ── The site's exact lighting rig (Chrysolin Website.html:32661-32665) ──
  scene.add(new THREE.HemisphereLight(0xffe0b8, 0x33425e, 0.5));
  var kl = new THREE.PointLight(0xffe3b0, 1.5, 100); kl.position.set(10,  5, 20); scene.add(kl);
  var rl = new THREE.PointLight(0x667eea, 1.0,  80); rl.position.set(-15,-5, 15); scene.add(rl);
  var al = new THREE.PointLight(0x764ba2, 0.8,  60); al.position.set(0, 10, 10);  scene.add(al);
  var fl = new THREE.PointLight(0xffffff, 0.8,  80); fl.position.set(0,  0, 15);  scene.add(fl);

  renderer.localClippingEnabled = true;   // required for the scroll clip planes
  createGlassFBO();
  createBackdropBlur();
  createOverlay();
  // exposed for the frost verification harness
  window.__glassFBO = glassFBO;
  window.__bdFBO2 = bdFBO2;
  window.__renderBlur = renderBackdropBlur;
  window.__overlayScene = czOverlayScene;
  window.__overlayCamera = czOverlayCamera;
  clock = new THREE.Clock();
  buildFakeSite();
  window.addEventListener('resize', onResize);
}

function isPortrait(){ return forcePortrait || camera.aspect < 1.0; }

// A few grey panels standing in for the site's product floors, so the sideways
// camera move visibly sweeps the website off screen rather than just cutting.
var fakeSite = null;
function buildFakeSite(){
  fakeSite = new THREE.Group();
  for(var f = 0; f < 4; f++){
    var y = -f * FLOOR_SPACING;
    for(var i = 0; i < 5; i++){
      var a = (i/5) * Math.PI*2;
      var m = new THREE.Mesh(
        new THREE.PlaneGeometry(1.5, 2.0),
        new THREE.MeshBasicMaterial({color:0xc9cede, transparent:true, opacity:0.5, side:THREE.DoubleSide})
      );
      m.position.set(Math.sin(a)*2.6, y, Math.cos(a)*2.6);
      m.lookAt(0, y, 0);
      fakeSite.add(m);
    }
  }

  // Colour behind each customizer page. Frosted glass is invisible over a flat
  // white background — there has to be something to blur before the material can
  // be judged at all. The live site has the product floors and the orb sitting
  // back there; this stands in for them.
  [-7, 7].forEach(function(px, pi){
    for(var i=0;i<9;i++){
      var hue = (pi*0.45 + i*0.11) % 1;
      var col = new THREE.Color().setHSL(hue, 0.62, 0.58);
      var geo = (i % 3 === 0) ? new THREE.SphereGeometry(0.85, 20, 14)
              : (i % 3 === 1) ? new THREE.BoxGeometry(1.3, 1.3, 1.3)
                              : new THREE.TorusGeometry(0.7, 0.26, 12, 28);
      var m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:col}));
      m.position.set(px + Math.cos(i*2.1)*3.4,
                     CZ_STAGE_Y_HINT + Math.sin(i*1.7)*2.6,
                     -3.5 - (i % 4) * 1.2);
      m.rotation.set(i*0.5, i*0.9, 0);
      fakeSite.add(m);
    }
  });
  scene.add(fakeSite);
}
var CZ_STAGE_Y_HINT = FLOOR_SPACING;   // matches CZ_STAGE_Y; harness-only
 // ── THE SITE'S GLASS, ported verbatim ────────────────────────────────────────
// generateScratchTexture / generateFrostTexture / GLARE_GLSL_CALC /
// createGlassShaderMaterial and the glassFBO pass are all lifted from
// Chrysolin Website.html (lines 1472, 1504, 1556, 7808, 7571). They already
// exist in the site, so at port time this whole block is deleted and CZ calls
// the site's own functions — which is exactly why it is reproduced faithfully
// here rather than approximated.
var _scratchTex = null;
function generateScratchTexture(){
  if(_scratchTex) return _scratchTex;
  var size = 512, c = document.createElement('canvas');
  c.width = c.height = size;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,size,size);
  ctx.lineCap = 'round';
  for(var i=0;i<120;i++){
    var x = Math.random()*size, y = Math.random()*size;
    var angle = Math.random()*Math.PI, len = 15 + Math.random()*80;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.15 + Math.random()*0.85) + ')';
    ctx.lineWidth = 0.3 + Math.random()*1.0;
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x + Math.cos(angle)*len, y + Math.sin(angle)*len); ctx.stroke();
    if(Math.random() > 0.6){
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.quadraticCurveTo(x + Math.cos(angle+0.3)*len*0.5, y + Math.sin(angle+0.3)*len*0.5,
                           x + Math.cos(angle+0.2)*len*0.7, y + Math.sin(angle+0.2)*len*0.7);
      ctx.stroke();
    }
  }
  ctx.filter = 'blur(0.5px)'; ctx.drawImage(c,0,0); ctx.filter = 'none';
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.needsUpdate = true;
  _scratchTex = tex; return tex;
}

var _frostTex = null;
function generateFrostTexture(){
  if(_frostTex) return _frostTex;
  var size = 512, c = document.createElement('canvas');
  c.width = c.height = size;
  var ctx = c.getContext('2d');
  var img = ctx.createImageData(size,size), d = img.data, seeds = [];
  for(var s=0;s<30;s++) seeds.push({x:(Math.sin(s*127.1+311.7)*0.5+0.5), y:(Math.sin(s*269.5+183.3)*0.5+0.5)});
  for(var i=0;i<d.length;i+=4){
    var px = (i/4)%size, py = Math.floor((i/4)/size);
    var u = px/size, v = py/size, minDist = 1.0;
    for(var k=0;k<30;k++){
      var dx = u-seeds[k].x, dy = v-seeds[k].y;
      var dist = Math.sqrt(dx*dx+dy*dy);
      if(dist < minDist) minDist = dist;
    }
    var cellVal = Math.min(minDist*6.0, 1.0);
    var grain = Math.sin(px*0.35+py*0.28)*Math.cos(py*0.41-px*0.19)*0.5+0.5;
    var val = Math.floor((cellVal*0.7 + grain*0.3)*255);
    d[i]=d[i+1]=d[i+2]=val; d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  ctx.filter = 'blur(3px)'; ctx.drawImage(c,0,0); ctx.filter = 'none';
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.needsUpdate = true;
  _frostTex = tex; return tex;
}

var GLARE_GLSL_CALC = [
  '  float sweep = time * 0.2;',
  '  vec3 glareDir = normalize(vec3(sin(sweep) * 1.5, 0.8 + sin(sweep * 0.7) * 0.3, cos(sweep * 0.6)));',
  '  vec3 glareH = normalize(V + glareDir);',
  '  float NdH = max(dot(N, glareH), 0.0);',
  '  float glareSpec = pow(NdH, 64.0);',
  '  float glareFresnel = pow(1.0 - max(dot(N, V), 0.0), 5.0);',
  '  float glareStrength = glareSpec * (0.4 + glareFresnel * 1.5);',
  '  vec3 glareDir2 = normalize(vec3(cos(sweep * 0.8) * 1.2, -0.4, sin(sweep * 1.1)));',
  '  vec3 glareH2 = normalize(V + glareDir2);',
  '  float glareSpec2 = pow(max(dot(N, glareH2), 0.0), 32.0) * 0.3;',
  '  vec2 eps = vec2(1.0/512.0, 0.0);',
  '  float sC = texture2D(tScratch, vUv).r;',
  '  float sR = texture2D(tScratch, vUv + eps.xy).r;',
  '  float sU = texture2D(tScratch, vUv + eps.yx).r;',
  '  vec3 Nscr = normalize(N + vec3((sC - sR) * 0.4, (sC - sU) * 0.4, 0.0));',
  '  float scratchGlare = pow(max(dot(Nscr, glareH), 0.0), 24.0) * sC;',
  '  float frostVal = texture2D(tFrost, vUv).r;',
  '  col += col * (frostVal - 0.5) * 0.08;',
  '  col = mix(col, vec3(0.82, 0.86, 0.95), 0.08 + frostVal * 0.06);',
  '  vec3 glareResult = vec3(0.0);',
  '  glareResult += vec3(0.95, 0.97, 1.0) * glareStrength * 0.5;',
  '  glareResult += vec3(0.90, 0.94, 1.0) * glareSpec2;',
  '  glareResult += vec3(1.0, 1.0, 0.97) * scratchGlare * glareStrength * 2.0;'
].join('\n');

function createGlassShaderMaterial(o){
  o = o || {};
  return new THREE.ShaderMaterial({
    uniforms: {
      tBlur:{value:null},
      resolution:{value:new THREE.Vector2(window.innerWidth, window.innerHeight)},
      refractionStrength:{value: o.refraction !== undefined ? o.refraction : 0.035},
      tintColor:{value: o.tint ? new THREE.Color().fromArray(o.tint) : new THREE.Color(0.95,0.96,0.99)},
      tintStrength:{value: o.tintStrength !== undefined ? o.tintStrength : 0.55},
      fresnelPower:{value:2.0},
      fresnelStrength:{value: o.fresnel !== undefined ? o.fresnel : 0.3},
      time:{value:0},
      tScratch:{value:generateScratchTexture()},
      tFrost:{value:generateFrostTexture()},
      hoverPress:{value:0.0},
      uAlpha:{value: o.alpha !== undefined ? o.alpha : 0.92},
      saturation:{value: o.saturation !== undefined ? o.saturation : 1.6},
      grain:{value: o.grain !== undefined ? o.grain : 0.018},
      sheenI:{value: o.sheen !== undefined ? o.sheen : 0.18},
      uOrtho:{value: o.ortho ? 1.0 : 0.0},
      fadeLeft:{value: o.fadeLeft !== undefined ? o.fadeLeft : 0.0},
      uSize:{value: new THREE.Vector2(o.w || 1, o.h || 1)},
      uRadius:{value: o.radius || 0},
      uBorderW:{value: o.border || 0},
      uBorderA:{value: o.borderA !== undefined ? o.borderA : 0.5},
      uBorderCol:{value: o.borderCol ? new THREE.Color().fromArray(o.borderCol)
                                     : new THREE.Color(0.62,0.65,0.70)},
      uSolid:{value: o.solid ? 1.0 : 0.0}
    },
    vertexShader: [
      'uniform float hoverPress;',
      'varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewDir;',
      '#include <clipping_planes_pars_vertex>',
      'uniform float uOrtho;',
      'void main() {',
      '  vUv = uv;',
      '  vec3 transformed = position - normal * hoverPress * 0.04;',
      // Must be named `mvPosition`: the r128 clipping_planes_vertex chunk reads
      // that identifier directly. The site's copy calls it mvPos, which is fine
      // there only because it never includes the clipping chunks.
      '  vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.0);',
      '  vNormal = normalize(normalMatrix * normal);',
      // Under an orthographic camera every eye ray is parallel, so the view
      // direction is constant. Deriving it from the vertex position (correct for
      // perspective) would fake a converging view and smear the fresnel rim
      // across the panel instead of keeping it on the bevel where it belongs.
      '  vViewDir = mix(normalize(-mvPosition.xyz), vec3(0.0, 0.0, 1.0), uOrtho);',
      '  gl_Position = projectionMatrix * mvPosition;',
      '  #include <clipping_planes_vertex>',
      '}'
    ].join('\n'),
    // FROSTED GLASS — the backdrop is read from an already heavily blurred
    // texture rather than refracted sharply. That single change is what makes it
    // read as ground glass instead of a lens.
    //
    // The rest is what the Apple materials actually do on top of a blur, and it
    // matters more than the blur itself:
    //   • saturation pushed above 1 (their "vibrancy" — a plain blur looks dead)
    //   • a translucent tint layer, heavy enough to carry text contrast
    //   • a bright fresnel rim, which is what reads as a pane with thickness
    //   • fine grain, because a big blur of a smooth gradient bands badly
    fragmentShader: [
      'uniform sampler2D tBlur, tScratch, tFrost;',
      'uniform vec2 resolution;',
      'uniform float refractionStrength;',
      'uniform vec3 tintColor;',
      'uniform float tintStrength, fresnelPower, fresnelStrength, time, hoverPress, uAlpha;',
      'uniform float saturation, grain, sheenI, fadeLeft;',
      'uniform vec2 uSize; uniform float uRadius, uBorderW, uBorderA;',
      'uniform vec3 uBorderCol; uniform float uSolid;',
      'varying vec2 vUv; varying vec3 vNormal, vViewDir;',
      '#include <clipping_planes_pars_fragment>',
      'void main() {',
      '  #include <clipping_planes_fragment>',
      '  vec3 N=normalize(vNormal); vec3 V=normalize(vViewDir);',
      '  vec2 screenUV=gl_FragCoord.xy/resolution;',
      // The bevel still bends what is behind it, just gently — enough to make
      // the rim feel like thick glass without reintroducing a lens.
      '  vec2 uvB = screenUV + N.xy * refractionStrength;',
      '  vec3 col = texture2D(tBlur, uvB).rgb;',
      '  float lum = dot(col, vec3(0.2126,0.7152,0.0722));',
      '  col = mix(vec3(lum), col, saturation);',
      '  col = mix(col, tintColor, tintStrength);',
      // Ground-glass density variation — very faint, or it reads as dirt.
      '  float f = texture2D(tFrost, vUv*1.6).r;',
      '  col += (f - 0.5) * 0.055;',
      '  float sc = texture2D(tScratch, vUv*1.2).r;',
      '  col += sc * 0.030;',
      '  float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453);',
      '  col += (n - 0.5) * grain;',
      '  float fres = pow(1.0 - max(dot(V,N),0.0), fresnelPower) * fresnelStrength;',
      '  col += vec3(1.0,1.0,1.0) * fres * 0.55;',
      // A soft moving sheen, keeping a trace of the site's glare sweep without
      // the hard specular that fought the frosted look.
      '  float sweep = time * 0.2;',
      '  vec3 gd = normalize(vec3(sin(sweep)*1.5, 0.8 + sin(sweep*0.7)*0.3, cos(sweep*0.6)));',
      '  float sheen = pow(max(dot(N, normalize(V + gd)), 0.0), 40.0);',
      '  col += vec3(0.98,0.99,1.0) * sheen * sheenI;',
      // SOLID surfaces bypass the whole frosted stack. An accent fill built from
      // a blurred backdrop plus grain, frost and scratch is never one colour —
      // it mottles, and at accent sizes that reads as dirt rather than material.
      // Mixing to the flat tint at the end kills all of it in one place, and
      // takes the fresnel out of the alpha too so the edge stays even.
      '  col = mix(col, tintColor, uSolid);',
      '  col = mix(col, vec3(0.05, 0.08, 0.18), hoverPress * 0.45);',
      // Alpha ramps in across the inner edge instead of stopping at a drawn
      // border. Multiplying the FINAL alpha (not just the base) is what matters:
      // it takes the fresnel rim down with it, otherwise the bevel would light a
      // bright line exactly where the panel is supposed to be disappearing.
      '  float fade = fadeLeft > 0.0 ? smoothstep(0.0, fadeLeft, vUv.x) : 1.0;',
      '  float a = (uAlpha + fres * 0.22 * (1.0 - uSolid)) * fade;',
      // ── Rounded rectangle, as a signed distance field ──────────────────────
      // Corners and the hairline border are computed here rather than modelled,
      // which is what lets a control stay a flat quad and still have perfectly
      // smooth corners at any size. uSize is in pixels and the overlay is 1:1
      // with the screen, so a fixed 1px smoothstep IS the correct antialiasing —
      // no fwidth, and therefore no derivatives extension to depend on.
      '  if(uRadius > 0.0 || uBorderW > 0.0){',
      '    vec2 p = (vUv - 0.5) * uSize;',
      '    vec2 q = abs(p) - (uSize * 0.5 - uRadius);',
      '    float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - uRadius;',
      '    float outer = 1.0 - smoothstep(-1.0, 1.0, d);',
      '    a *= outer;',
      '    if(uBorderW > 0.0){',
      '      float inner = 1.0 - smoothstep(-1.0, 1.0, d + uBorderW);',
      '      float ring = clamp(outer - inner, 0.0, 1.0) * uBorderA;',
      '      col = mix(col, uBorderCol, ring);',
      '      a = max(a, ring);',   // the outline survives even a near-clear fill
      '    }',
      '  }',
      '  gl_FragColor=vec4(col, clamp(a, 0.0, 1.0));',
      '}'
    ].join('\n'),
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
    clipping: true
  });
}

// The glass reads a snapshot of the scene WITHOUT the glass in it. Half
// resolution: it is only ever read after a heavy blur, so the detail is thrown
// away anyway and this halves the cost of the extra pass.
var glassFBO = null;
function createGlassFBO(){
  var pr = renderer.getPixelRatio();
  glassFBO = new THREE.WebGLRenderTarget(
    Math.floor(window.innerWidth * pr * 0.5),
    Math.floor(window.innerHeight * pr * 0.5),
    {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat}
  );
}
function resizeGlassFBO(){
  if(!glassFBO) return;
  var pr = renderer.getPixelRatio();
  glassFBO.setSize(Math.floor(window.innerWidth * pr * 0.5),
                   Math.floor(window.innerHeight * pr * 0.5));
}

// ── BACKDROP BLUR ────────────────────────────────────────────────────────────
// Separable 9-tap Gaussian, ping-ponged at quarter resolution — the same system
// the site already runs (createBackdropBlur, line 7598). Run several times with
// a widening step, which is what buys a blur radius large enough to read as
// frosted rather than merely soft; a single pass at this kernel size barely
// smudges. Quarter res makes the whole chain nearly free, and downsampling is
// itself a blur, so it costs nothing in quality here.
var bdFBO1, bdFBO2, bdScene, bdCamera, bdQuad;
function createBackdropBlur(){
  var pr = Math.min(window.devicePixelRatio, 1.5);
  var w = Math.floor(window.innerWidth * pr * 0.25);
  var h = Math.floor(window.innerHeight * pr * 0.25);
  var o = {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat};
  bdFBO1 = new THREE.WebGLRenderTarget(w, h, o);
  bdFBO2 = new THREE.WebGLRenderTarget(w, h, o);
  bdScene = new THREE.Scene();
  bdCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  bdQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({
    uniforms: {tInput:{value:null}, direction:{value:new THREE.Vector2(1,0)}},
    vertexShader: 'varying vec2 vUV;void main(){vUV=uv;gl_Position=vec4(position,1.0);}',
    fragmentShader: [
      'uniform sampler2D tInput; uniform vec2 direction; varying vec2 vUV;',
      'void main(){',
      '  vec4 s=vec4(0.0);',
      '  s+=texture2D(tInput,vUV-4.0*direction)*0.0162;',
      '  s+=texture2D(tInput,vUV-3.0*direction)*0.0540;',
      '  s+=texture2D(tInput,vUV-2.0*direction)*0.1218;',
      '  s+=texture2D(tInput,vUV-1.0*direction)*0.1962;',
      '  s+=texture2D(tInput,vUV)*0.2236;',
      '  s+=texture2D(tInput,vUV+1.0*direction)*0.1962;',
      '  s+=texture2D(tInput,vUV+2.0*direction)*0.1218;',
      '  s+=texture2D(tInput,vUV+3.0*direction)*0.0540;',
      '  s+=texture2D(tInput,vUV+4.0*direction)*0.0162;',
      '  gl_FragColor=s;',
      '}'
    ].join('\n'),
    depthWrite:false, depthTest:false
  }));
  bdScene.add(bdQuad);
}
function resizeBackdropBlur(){
  if(!bdFBO1) return;
  var pr = Math.min(window.devicePixelRatio, 1.5);
  var w = Math.floor(window.innerWidth * pr * 0.25);
  var h = Math.floor(window.innerHeight * pr * 0.25);
  bdFBO1.setSize(w,h); bdFBO2.setSize(w,h);
}
// Returns the blurred texture. Each iteration widens the step, so three passes
// reach a radius a single 9-tap kernel could never touch.
function renderBackdropBlur(srcTex, iterations){
  if(!bdFBO1) return srcTex;
  var u = bdQuad.material.uniforms;
  var w = bdFBO1.width, h = bdFBO1.height;
  var src = srcTex;
  for(var i=0;i<iterations;i++){

// zero at u=0 and u=1 — so the two halves meet exactly, with a natural crease
// where a real side seam would be.
function buildShellGeo(P){

        // The back shell's u is mirrored so its artwork reads the right way round
        // when you walk around the garment instead of appearing flipped.
        var tu = (s === 0) ? u : (1 - u);
        uvs.push(rect[0] + tu * rect[2], rect[1] + v * rect[3]);
      }
    }
    for(var i2 = 0; i2 < rows; i2++){
      for(var j2 = 0; j2 < cols; j2++){
        if(P.skip && P.skip((j2 + 0.5)/cols, (i2 + 0.5)/rows)) continue;
        var a = base + i2*(cols+1) + j2, b = a + 1, c = a + (cols+1), d2 = c + 1;
        // Front winds CCW seen from +z; back is reversed so its normals face out.
        if(s === 0) idx.push(a, b, d2, a, d2, c);

  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);

// armpit the width is the body; above it, it flares out to the sleeve tip. And
// because depth is multiplied by sin(u*PI) it falls to zero at the outer edges,
// so the sleeves come out thin and the body stays full — which is exactly how a
// tee looks laid flat. One shell, one UV island, no seams to hide.

    rows:34, cols:34, height:1.0, yBase:-0.5,
    halfW: function(v){

//
// This model's UVs are raw CLO/Marvelous sewing-pattern coordinates in
// millimetres (u spans ±256, v spans -406..297), not 0-1. Each region is
// normalised by its OWN combined bounds — per region, not per mesh, because a
// panel is split across several meshes (the front alone is three) and
// normalising each separately would tear the artwork along their seams.
//
// v is flipped because the pattern runs shoulder->hem downward while texture v
// with CanvasTexture flipY runs bottom-up. The back panel's mirroring is left
// exactly as authored: a sewing pattern already mirrors the back so it reads
// correctly when you walk around behind the garment.

  var sx = B.rect[2] / B.wMM, sy = B.rect[3] / B.hMM;
  var w = p.widthMM * sx, h = p.widthMM * sy * (p.aspect || 1);
  var cx = B.rect[0] + B.rect[2] * (0.5 + (p.offsetXMM || 0)/B.wMM);
  var cy = B.rect[1] + B.rect[3] * (1 - p.downMM/B.hMM);
  return [cx - w/2, cy - h/2, w, h];
}

// Resolves each step's drawing rect once the pattern is known, so the painter
// and the thumbnails both read a single `rect` regardless of how it was
// specified.
function resolveStepRects(gd, pattern){
  gd.steps.forEach(function(s){
    if(s.placeMM && pattern){
      var r = rectFromMM(pattern, s.placeMM);
      if(r) s.rect = r;
    }
  });
}

function loadGarmentModel(gd, onDone){
  var spec = gd.model;
  if(!spec){ onDone(null); return; }
  ensureGLTFLoader(function(ok){
    if(!ok){ console.warn('[CZ] GLTFLoader unavailable — procedural fallback'); onDone(null); return; }
    var urls = spec.urls.slice();
    (function next(){
      if(!urls.length){ console.warn('[CZ] model unreachable — procedural fallback'); onDone(null); return; }
      var url = urls.shift();
      new THREE.GLTFLoader().load(url, function(gltf){
        try { onDone(prepareModel(gltf, spec)); }
        catch(e){ console.warn('[CZ] model prep failed', e); onDone(null); }
      }, undefined, function(){ next(); });
    })();
  });
}

// A CLO/Marvelous export carries cloth as a SOLID: an outer surface and an inner
// surface a millimetre apart. This model's front is 44,134 tris of outer plus
// 44,134 of inner; the back likewise. Since the garment renders DoubleSide, the
// inner shell is never visible and costs 92k triangles — 39% of the whole model.
//
// Detected rather than hardcoded: within a region, meshes are paired by
// identical triangle count, and the one whose normals point back toward the
// garment's centre is the inner one. Falls through harmlessly on a model that
// is not built this way.
function cullInnerSurfaces(regions, centre){
  var dropped = [], tris = 0;
  for(var key in regions){
    var list = regions[key];
    if(list.length < 2) continue;
    var byCount = {};
    list.forEach(function(m){
      var n = m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count;
      (byCount[n] = byCount[n] || []).push(m);
    });
    for(var n in byCount){
      var pair = byCount[n];
      if(pair.length !== 2) continue;
      var scored = pair.map(function(m){ return {m:m, s:outwardness(m, centre)}; });
      scored.sort(function(a,b){ return a.s - b.s; });
      // lowest outwardness = faces inward = the inner shell
      if(scored[0].s < scored[1].s){
        var inner = scored[0].m;
        var i = list.indexOf(inner);
        if(i >= 0) list.splice(i, 1);
        if(inner.parent) inner.parent.remove(inner);
        tris += (inner.geometry.index ? inner.geometry.index.count : inner.geometry.attributes.position.count)/3;
        inner.geometry.dispose();
        dropped.push(inner.name || '(unnamed)');
      }
    }
  }
  return {names:dropped, tris:tris};
}

// Mean agreement between a surface's normals and the direction away from the
// garment's centre. Near +1 for an outer shell, near -1 for an inner one.
function outwardness(mesh, centre){
  var pos = mesh.geometry.attributes.position, nrm = mesh.geometry.attributes.normal;
  if(!nrm) return 0;
  mesh.updateMatrixWorld(true);
  var NM = new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);
  var step = Math.max(1, Math.floor(pos.count/800)), sum = 0, n = 0;
  var v = new THREE.Vector3(), nv = new THREE.Vector3();
  for(var i=0;i<pos.count;i+=step){
    v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(mesh.matrixWorld).sub(centre);
    if(v.lengthSq() < 1e-9) continue;
    nv.set(nrm.getX(i), nrm.getY(i), nrm.getZ(i)).applyMatrix3(NM).normalize();
    sum += nv.dot(v.normalize()); n++;
  }
  return n ? sum/n : 0;
}

function prepareModel(gltf, spec){
  var root = gltf.scene;
  var regions = {}, meshes = [];
  root.updateMatrixWorld(true);

  // Region by nearest matching ANCESTOR name — the mesh nodes themselves are
  // called Object_10, Object_14 and so on, which say nothing. The garment
  // structure lives in their parents.
  root.traverse(function(o){
    if(!o.isMesh) return;
    meshes.push(o);
    var key = 'other', p = o;
    outer: while(p){
      for(var i=0;i<spec.regions.length;i++){
        if(spec.regions[i].test.test(p.name || '')){ key = spec.regions[i].uv; break outer; }
      }
      p = p.parent;
    }
    (regions[key] = regions[key] || []).push(o);
  });

  var box0 = new THREE.Box3().setFromObject(root);
  var culled = {names:[], tris:0};
  if(spec.cullInner !== false){
    culled = cullInnerSurfaces(regions, box0.getCenter(new THREE.Vector3()));
    meshes = meshes.filter(function(m){ return !!m.parent; });
  }

  var pattern = rebakeUVs(regions, CUSTOMIZER_DATA.uv);

  // Normalise to the model spec: 1.0 unit tall, origin at the visual centre.
  // This model arrives at real-world metres, standing on a body (y 0.94-1.64).
  var box = new THREE.Box3().setFromObject(root);
  var size = new THREE.Vector3(), centre = new THREE.Vector3();
  box.getSize(size); box.getCenter(centre);
  var s = 1.0 / (size.y || 1);
  var wrap = new THREE.Group();
  root.position.sub(centre);
  wrap.add(root);
  wrap.scale.setScalar(s);
  // Bake the facing correction here, so from the rest of the code's point of
  // view spin=0 always means "front toward +Z" no matter how the model was
  // authored. Nothing downstream needs to know this model was off-square.
  wrap.rotation.y = spec.modelYaw || 0;

  var tris = 0;
  meshes.forEach(function(m){
    tris += m.geometry.index ? m.geometry.index.count/3 : m.geometry.attributes.position.count/3;
  });

  return {object:wrap, meshes:meshes, pattern:pattern, tris:tris, culled:culled,
          regionCounts:Object.keys(regions).reduce(function(a,k){ a[k]=regions[k].length; return a; }, {})};
}

// ═══════════════════════════════════════════════════════════════════════════
// PROCEDURAL DESIGN ART
// ═══════════════════════════════════════════════════════════════════════════
// Stand-ins for the transparent PNGs that will live in product-images/. Drawn in
// a single ink so they stay legible on both a dark and a light base — which is a
// real constraint on the eventual artwork too, not just a harness shortcut.
var ART = {
  sigil: function(ctx, w, h, ink){
    ctx.strokeStyle = ink; ctx.fillStyle = ink;
    ctx.lineWidth = Math.max(2, w*0.016);
    var cx = w/2, cy = h/2, r = Math.min(w,h)*0.34;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r*0.62, 0, Math.PI*2); ctx.stroke();
    for(var i=0;i<6;i++){
      var a = (i/6)*Math.PI*2 - Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*r*0.62, cy + Math.sin(a)*r*0.62);
      ctx.lineTo(cx + Math.cos(a)*r*1.28, cy + Math.sin(a)*r*1.28);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + Math.cos(a)*r*1.28, cy + Math.sin(a)*r*1.28, w*0.018, 0, Math.PI*2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, r*0.16, 0, Math.PI*2); ctx.fill();
  },
  orbit: function(ctx, w, h, ink){
    ctx.strokeStyle = ink; ctx.fillStyle = ink;
    ctx.lineWidth = Math.max(2, w*0.012);
    var cx = w/2, cy = h/2;
    for(var i=0;i<4;i++){
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(i*Math.PI/4);
      ctx.beginPath(); ctx.ellipse(0, 0, Math.min(w,h)*0.42, Math.min(w,h)*0.15, 0, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx, cy, Math.min(w,h)*0.09, 0, Math.PI*2); ctx.fill();
  },
  strata: function(ctx, w, h, ink){
    ctx.fillStyle = ink;
    var n = 14;
    for(var i=0;i<n;i++){
      var t = i/n;
      var bh = h*0.030*(1 - t*0.55);
      var bw = w*(0.86 - t*0.42);
      ctx.globalAlpha = 0.35 + 0.65*(1-t);
      ctx.fillRect((w-bw)/2, h*0.10 + t*h*0.76, bw, bh);
    }
    ctx.globalAlpha = 1;
  },
  crest: function(ctx, w, h, ink){
    ctx.strokeStyle = ink; ctx.fillStyle = ink;
    ctx.lineWidth = Math.max(2, w*0.018);
    var cx = w/2;
    ctx.beginPath();
    ctx.moveTo(cx, h*0.10);
    ctx.lineTo(w*0.86, h*0.32);
    ctx.lineTo(w*0.86, h*0.62);
    ctx.lineTo(cx, h*0.92);
    ctx.lineTo(w*0.14, h*0.62);
    ctx.lineTo(w*0.14, h*0.32);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, h*0.30); ctx.lineTo(w*0.68, h*0.42);
    ctx.lineTo(cx, h*0.72); ctx.lineTo(w*0.32, h*0.42);
    ctx.closePath(); ctx.fill();
  },
  bloom: function(ctx, w, h, ink){
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.5, w*0.009);
    var cx = w/2, cy = h/2, R = Math.min(w,h)*0.44;
    for(var i=0;i<26;i++){
      var a = (i/26)*Math.PI*2;
      var r2 = R*(0.45 + 0.55*Math.abs(Math.sin(i*1.7)));
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(cx + Math.cos(a+0.35)*r2*0.7, cy + Math.sin(a+0.35)*r2*0.7,
                           cx + Math.cos(a)*r2,          cy + Math.sin(a)*r2);
      ctx.stroke();
    }
  },
  mark: function(ctx, w, h, ink){
    ctx.strokeStyle = ink; ctx.fillStyle = ink;
    ctx.lineWidth = Math.max(2, w*0.05);
    var cx = w/2, cy = h/2, r = Math.min(w,h)*0.32;
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI*0.15, Math.PI*1.55); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + r*0.72, cy - r*0.55, w*0.055, 0, Math.PI*2); ctx.fill();
  }
};

// Art is cached per (name, ink) — six designs on two bases is twelve small
// canvases for the whole session, drawn once.
var _artCache = {};
function artCanvas(name, ink, size){
  var key = name + '|' + ink + '|' + size;
  if(_artCache[key]) return _artCache[key];
  var c = document.createElement('canvas'); c.width = c.height = size;
  var ctx = c.getContext('2d');
  if(ART[name]) ART[name](ctx, size, size, ink);
  _artCache[key] = c;
  return c;
}

function inkFor(baseValue, garment){
  var step = findStep(garment, 'base');
  var val  = step && findValue(step, baseValue);
  if(!val) return '#e8e6e0';
  // Luminance of the base decides the ink, so new base colours work without a
  // manifest change.
  var hex = val.hex.replace('#','');
  var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  var lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.5 ? '#1b1f2a' : '#eceae4';
}

// ═══════════════════════════════════════════════════════════════════════════
// COMPOSITOR — one canvas draw per combination, never one asset per combination
// ═══════════════════════════════════════════════════════════════════════════
// Six backs and six fronts is twelve source images, not seventy-two renders.
// Two canvases exist so a change can cross-fade on the GPU rather than
// re-uploading a 1024² texture every frame.
function makeCompositor(garment){
  var cs = [], txs = [];
  for(var i=0;i<2;i++){
    var c = document.createElement('canvas');
    c.width = c.height = TEX_SIZE;
    cs.push(c);
    var t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    txs.push(t);
  }
  return {
    canvases: cs, textures: txs,
    cur: 0,          // which texture is fully showing
    mix: 0,          // 0 = textures[0], 1 = textures[1]
    mixFrom: 0, mixTo: 0, mixT: 1, mixDur: 1,

    // Texture v runs bottom-up but canvas y runs top-down, and CanvasTexture
    // defaults to flipY — so a UV rect's canvas box has its y mirrored.
    rectToCanvas: function(r){
      return {x: r[0]*TEX_SIZE, y: (1 - r[1] - r[3])*TEX_SIZE, w: r[2]*TEX_SIZE, h: r[3]*TEX_SIZE};
    },

    draw: function(idx, cfg){
      var ctx = cs[idx].getContext('2d');
      var baseStep = findStep(garment, 'base');
      var baseVal  = baseStep && findValue(baseStep, cfg.base);
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,TEX_SIZE,TEX_SIZE);
      ctx.fillStyle = baseVal ? baseVal.hex : '#888888';
      ctx.fillRect(0,0,TEX_SIZE,TEX_SIZE);

      // Faint cross-hatched weave so the fabric is not a flat colour under the
      // lights. Both axes, low alpha — a one-axis version read as corduroy.
      ctx.globalAlpha = 0.022;
      ctx.fillStyle = '#ffffff';
      for(var y=0;y<TEX_SIZE;y+=4) ctx.fillRect(0, y, TEX_SIZE, 1);
      for(var x=0;x<TEX_SIZE;x+=4) ctx.fillRect(x, 0, 1, TEX_SIZE);
      ctx.globalAlpha = 1;

      var ink = inkFor(cfg.base, garment);
      garment.steps.forEach(function(step){
        if(step.type !== 'thumb') return;
        var chosen = cfg[step.id];
        if(!chosen || chosen === 'None') return;
        var val = findValue(step, chosen);
        if(!val) return;
        var box = this.rectToCanvas(step.rect);
        var art = artCanvas(val.art, ink, 512);
        ctx.drawImage(art, box.x, box.y, box.w, box.h);
      }, this);
      ctx.restore();
      txs[idx].needsUpdate = true;
    },

    // Draw into whichever texture is NOT showing, then slide the mix across.
    crossfadeTo: function(cfg, durMs){
      var other = this.cur === 0 ? 1 : 0;
      this.draw(other, cfg);
      this.mixFrom = this.mix;
      this.mixTo   = other;      // other===1 -> mix 1, other===0 -> mix 0
      this.mixT    = 0;
      this.mixDur  = Math.max(1, durMs);
      this.cur     = other;
    },

    setImmediate: function(cfg){
      this.draw(0, cfg); this.draw(1, cfg);
      this.cur = 0; this.mix = 0; this.mixT = 1; this.mixFrom = 0; this.mixTo = 0;
    },

    update: function(dtMs){
      if(this.mixT >= 1) return;
      this.mixT = Math.min(1, this.mixT + dtMs/this.mixDur);
      var e = this.mixT<0.5 ? 2*this.mixT*this.mixT : 1-Math.pow(-2*this.mixT+2,2)/2;
      this.mix = this.mixFrom + (this.mixTo - this.mixFrom)*e;
    }
  };
}

// The garment carries its OWN lighting inside its shader, and is deliberately
// unaffected by the scene's lights.
//
// The first attempt here put the garment on a private layer with its own light
// rig, on the assumption that Three.js scopes lights to objects by layer. It
// does not — measured, not guessed: a dark tee sampled (98,99,128) with the
// site's lights active versus (22,24,30) without them, so the site's rig was
// reaching it straight through the layer separation. Light.layers only decides
// whether a light is COLLECTED for the frame, never which objects it touches.
//
// Baking three fixed directional terms plus a hemisphere and a rim into the
// material solves it outright, and is the better answer anyway:
//   • deterministic — a black tee and a white tee both land in range, which no
//     single exposure against the site's untone-mapped 5-light rig could do
//   • identical in the harness and in the site, so the port cannot drift
//   • lights are WORLD-space, so the garment keeps its shading as it spins and
//     as it travels ±7 units across to its page
//   • cheaper than MeshStandardMaterial
// The two-map crossfade rides along in the same shader, which is what makes a
// combination change cost one uniform instead of a 1024² texture re-upload.
var CZ_VERT = [
  'varying vec2 vCzUv;',
  'varying vec3 vCzN;',
  'varying vec3 vCzWorld;',
  'void main(){',
  '  vCzUv = uv;',
  '  vCzN = normalize(mat3(modelMatrix) * normal);',
  '  vec4 wp = modelMatrix * vec4(position, 1.0);',
  '  vCzWorld = wp.xyz;',
  '  gl_Position = projectionMatrix * viewMatrix * wp;',
  '}'
].join('\n');

var CZ_FRAG = [
  'uniform sampler2D map;',
  'uniform sampler2D map2;',
  'uniform float mixT;',
  'uniform vec3 dirA; uniform vec3 colA;',
  'uniform vec3 dirB; uniform vec3 colB;',
  'uniform vec3 dirC; uniform vec3 colC;',
  'uniform vec3 skyCol; uniform vec3 groundCol; uniform float ambI;',
  'uniform vec3 rimCol; uniform float rimI;',
  'varying vec2 vCzUv;',
  'varying vec3 vCzN;',
  'varying vec3 vCzWorld;',
  'void main(){',
  '  vec4 base = mix(texture2D(map, vCzUv), texture2D(map2, vCzUv), mixT);',
  '  vec3 N = normalize(vCzN);',
  // Two-sided: flip toward the viewer so the inside of the neck opening reads as
  // lit fabric instead of a black hole.
  '  if(!gl_FrontFacing) N = -N;',
  '  vec3 lit = mix(groundCol, skyCol, N.y * 0.5 + 0.5) * ambI;',
  '  lit += colA * max(dot(N, dirA), 0.0);',
  '  lit += colB * max(dot(N, dirB), 0.0);',
  '  lit += colC * max(dot(N, dirC), 0.0);',
  '  vec3 V = normalize(cameraPosition - vCzWorld);',
  '  float rim = pow(1.0 - max(dot(N, V), 0.0), 2.5);',
  '  gl_FragColor = vec4(base.rgb * lit + rimCol * (rim * rimI), 1.0);',
  '}'
].join('\n');

function v3(x,y,z){ return new THREE.Vector3(x,y,z).normalize(); }

function makeGarmentMaterial(comp){
  var u = {
    map:       {value: comp.textures[0]},
    map2:      {value: comp.textures[1]},
    mixT:      {value: 0},
    dirA:      {value: v3( 0.45,  0.60,  0.75)},   // warm key, front-upper-right
    colA:      {value: new THREE.Color(1.00, 0.96, 0.90).multiplyScalar(0.75)},
    dirB:      {value: v3(-0.85,  0.05,  0.40)},   // cool fill from the left
    colB:      {value: new THREE.Color(0.74, 0.80, 1.00).multiplyScalar(0.34)},
    dirC:      {value: v3( 0.10, -0.50, -0.90)},   // bounce from below/behind
    colC:      {value: new THREE.Color(0.85, 0.88, 1.00).multiplyScalar(0.30)},
    skyCol:    {value: new THREE.Color(0.96, 0.97, 1.00)},
    groundCol: {value: new THREE.Color(0.30, 0.34, 0.45)},
    ambI:      {value: 0.42},
    rimCol:    {value: new THREE.Color(1.00, 0.98, 0.94)},
    rimI:      {value: 0.20}                        // keeps a black garment from
  };                                                // flattening into a cutout
  var mat = new THREE.ShaderMaterial({
    uniforms: u, vertexShader: CZ_VERT, fragmentShader: CZ_FRAG,
    side: THREE.DoubleSide
  });
  mat.userData.mixT = u.mixT;
  return mat;
}

// ═══════════════════════════════════════════════════════════════════════════
// GLASS PANELS — the site's cart-window material
// ═══════════════════════════════════════════════════════════════════════════
// CZ supplies the BEVEL GEOMETRY; the host supplies the material. The bevel is
// real geometry — vertices within a border band are pushed back in z, so
// computeVertexNormals gives that band genuinely angled normals, which is what
// makes the refraction and glare break along the edge like cut glass.
//
// The material itself is the site's createGlassShaderMaterial, the same one the
// cart window uses, so this reads as the same pane of glass rather than an
// imitation of it. At port time the host stub goes away and the site's own
// function is called directly.
// The site's glass, differentiated only by tint and opacity. Everything shares
// the same refraction / glare / scratch / frost so the customizer reads as the
// same material as the cart window rather than a lookalike.
// Layered like the Apple materials: the rail is a thick, nearly opaque frosted
// sheet reading the blurred backdrop, and the controls on top of it are thin
// translucent films that let the sheet show through rather than punching holes
// in it. Selection and the primary action break warm.
// Neutral throughout, with selection carried by a DARK GREY rather than a hue.
// Fresnel and sheen are near zero on the controls — those are lighting cues, and
// lighting cues are exactly what made flat interface elements look like objects.
// The rail keeps a trace of both because it is a large surface and reads as one.
var CZ_TINTS = {
  panel:    {tint:[0.95,0.96,0.99], tintStrength:0.62, alpha:0.97, refraction:0.030,
             fresnel:0.30, saturation:1.65, grain:0.020, sheen:0.14, fadeLeft:0.16,
             radius:0, border:0},
  // segmented control: recessed track + sliding dark thumb
  track:    {tint:[0.74,0.76,0.81], tintStrength:0.55, alpha:0.34, refraction:0.010,
             fresnel:0.05, saturation:1.00, grain:0.010, sheen:0.03,
             radius:999, border:0},
  thumb:    {tint:[0.42,0.44,0.48], tintStrength:1.0, alpha:1.0, solid:true,
             grain:0, sheen:0, fresnel:0,
             radius:999, border:0},
  // design thumbnails: selection is a ring, so the artwork underneath stays legible
  cell:     {tint:[1.00,1.00,1.00], tintStrength:0.40, alpha:0.26, refraction:0.010,
             fresnel:0.06, saturation:1.25, grain:0.010, sheen:0.04,
             radius:16, border:1.0, borderCol:[0.66,0.69,0.74], borderA:0.55},
  cellOn:   {tint:[1.00,1.00,1.00], tintStrength:0.40, alpha:0.30, refraction:0.010,
             fresnel:0.06, saturation:1.25, grain:0.010, sheen:0.04,
             radius:16, border:2.5, borderCol:[0.24,0.26,0.30], borderA:0.98},
  cellOff:  {tint:[0.90,0.91,0.94], tintStrength:0.55, alpha:0.14, refraction:0.004,
             fresnel:0.03, saturation:0.55, grain:0.006, sheen:0.02,
             radius:16, border:1.0, borderCol:[0.78,0.80,0.83], borderA:0.30},
  // primary action: solid dark grey
  button:   {tint:[0.41,0.43,0.47], tintStrength:1.0, alpha:1.0, solid:true,
             grain:0, sheen:0, fresnel:0,
             radius:18, border:0},
  buttonAlt:{tint:[1.00,1.00,1.00], tintStrength:0.42, alpha:0.30, refraction:0.010,
             fresnel:0.06, saturation:1.10, grain:0.010, sheen:0.04,
             radius:16, border:1.0, borderCol:[0.66,0.69,0.74], borderA:0.50}
};

// Sizes are in PIXELS — the overlay is orthographic and pixel-sized.
//
// FLAT quads. The bevel that used to be modelled here is gone: real chamfered
// geometry is what kept these reading as little 3D objects sitting in space
// rather than as interface. Corners and outlines are now signed-distance work in
// the fragment shader, which is both flatter and sharper — a modelled rounded
// corner is only as smooth as its segment count, an SDF corner is exact at any
// size.
function czGlassPanel(w, h, kind){
  var T = CZ_TINTS[kind] || CZ_TINTS.cell;
  var geo = new THREE.PlaneGeometry(w, h, 1, 1);

  var opts = {}; for(var k in T) opts[k] = T[k];
  opts.ortho = true;
  opts.w = w; opts.h = h;
  // A radius bigger than the half-height means "pill" — clamped here so callers
  // can just ask for a huge number and get a capsule at whatever size.
  opts.radius = Math.min(T.radius || 0, Math.min(w, h) / 2);

  var mesh = new THREE.Mesh(geo, cz.host.ui.glassMaterial(opts));
  mesh.userData.czGlass = true;
  mesh.renderOrder = (kind === 'panel') ? 10 : 12;
  return mesh;
}

// ═══════════════════════════════════════════════════════════════════════════
// MANIFEST HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function findStep(garment, id){
  for(var i=0;i<garment.steps.length;i++) if(garment.steps[i].id === id) return garment.steps[i];
  return null;
}
function findValue(step, v){
  for(var i=0;i<step.values.length;i++) if(step.values[i].v === v) return step.values[i];
  return null;
}
function defaultConfig(garment){
  var cfg = {};
  garment.steps.forEach(function(s){
    cfg[s.id] = s.allowNone ? 'None' : (s.values[1] ? s.values[1].v : s.values[0].v);
  });
  return cfg;
}
function slug(s){ return String(s).toUpperCase().replace(/[^A-Z0-9]/g, ''); }

// Human-ish and round-trippable. Readability on the order comes from the
// properties; this exists so a link can reopen the exact configuration.
function encodeConfig(garment, cfg){
  var parts = [garment.code];
  garment.steps.forEach(function(s){ parts.push(slug(cfg[s.id] || 'NONE')); });
  return parts.join('-');
}
function decodeConfig(code){
  if(!code) return null;
  var parts = String(code).split('-');
  var g = null;
  for(var i=0;i<CUSTOMIZER_DATA.garments.length;i++){
    if(CUSTOMIZER_DATA.garments[i].code === parts[0]) g = CUSTOMIZER_DATA.garments[i];
  }
  if(!g) return null;
  var cfg = defaultConfig(g);
  g.steps.forEach(function(s, i){
    var want = parts[i+1];
    if(!want) return;
    if(want === 'NONE' && s.allowNone){ cfg[s.id] = 'None'; return; }
    for(var k=0;k<s.values.length;k++){
      if(slug(s.values[k].v) === want){ cfg[s.id] = s.values[k].v; return; }
    }
  });
  return {garment:g, config:cfg};
}
function configLink(garment, cfg){
  return location.origin + location.pathname + '?cz=' + encodeConfig(garment, cfg);
}

// ═══════════════════════════════════════════════════════════════════════════
// SHOPIFY — variants by option, designs as line-item properties
// ═══════════════════════════════════════════════════════════════════════════
// The site currently matches variants with `v.title === sizeLabel`. Once a
// product has two options a variant's title is "M / Dark", so that comparison
// never matches and the code silently falls through to "first available
// variant" — the customer receives the wrong garment and nothing errors. Match
// on selectedOptions instead.
function resolveVariant(product, sel){
  var vs = (product && product.shopifyVariants) || [];
  for(var i=0;i<vs.length;i++){
    var opts = vs[i].selectedOptions || [];
    if(!opts.length) continue;
    var ok = true;
    for(var j=0;j<opts.length;j++){
      if(sel[opts[j].name] !== opts[j].value){ ok = false; break; }
    }
    if(ok) return vs[i];
  }
  return null;
}

// Selections that map onto real Shopify options, drawn from the manifest rather
// than hardcoded, so a garment with different option names still works.
function optionSelection(garment, cfg){
  var sel = {};
  garment.steps.forEach(function(s){ if(s.option) sel[s.option] = cfg[s.id]; });
  return sel;
}

function variantAvailable(garment, cfg, overrideStepId, overrideValue){
  var product = cz.host.shopify.byHandle(garment.shopifyHandle);
  if(!product) return true;
  var probe = {};
  for(var k in cfg) probe[k] = cfg[k];
  if(overrideStepId) probe[overrideStepId] = overrideValue;
  var v = resolveVariant(product, optionSelection(garment, probe));
  return v ? v.available !== false : false;
}

// Every cart mutation goes through here, so the eventual Cart API migration is
// one function rather than a hunt through the file.
function czNotify(msg){ if(cz.host && cz.host.notify) cz.host.notify(msg); }

function czCartAdd(garment, cfg){
  var product = cz.host.shopify.byHandle(garment.shopifyHandle);
  if(!product){ console.warn('[CZ] no Shopify product for', garment.shopifyHandle); return; }
  var variant = resolveVariant(product, optionSelection(garment, cfg));
  if(!variant){ console.warn('[CZ] no variant for', optionSelection(garment, cfg)); return; }
  if(variant.available === false){ czNotify('that combination is sold out'); return; }

  var code = encodeConfig(garment, cfg);
  var attrs = {};
  garment.steps.forEach(function(s){
    if(s.option) return;                       // already carried by the variant
    attrs[s.label] = cfg[s.id] || 'None';
  });
  attrs.Config  = code;
  attrs.Preview = configLink(garment, cfg);

  cz.host.shopify.addLine({
    // The local cart key must include the config, or two different designs in
    // the same size collapse into one line at quantity 2.
    cartId: product.id + '-' + variant.id + '-' + code,
    variantId: variant.id,
    title: product.title,
    price: product.price,
    qty: 1,
    attrs: attrs
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// STAGE
// ═══════════════════════════════════════════════════════════════════════════
function buildStage(){
  cz.stage = new THREE.Group();
  cz.stage.position.set(0, CZ_STAGE_Y, 0);
  cz.host.scene.add(cz.stage);

  CUSTOMIZER_DATA.garments.forEach(function(gd, i){
    var comp = makeCompositor(gd);

    var pivot = new THREE.Group();        // spin/bob lives here, model stays clean
    var homeX = gd.side === 'left' ? -STAGE_GAP : STAGE_GAP;
    pivot.position.set(homeX, 0, 0);
    pivot.scale.setScalar(STAGE_SCALE);
    cz.stage.add(pivot);

    var g = {
      data: gd, pivot: pivot, comp: comp, mats: [], body: null,
      homeX: homeX, pageX: (gd.side === 'left' ? -PAGE_X : PAGE_X),
      spin: 0, spinVel: 0.35, bobPhase: i * 1.9,
      showcaseIdx: 0, showcaseT: 0,
      faceTarget: null, hoverEase: 0, pattern: null
    };
    g.setMix = function(v){
      for(var k=0;k<this.mats.length;k++) this.mats[k].userData.mixT.value = v;
    };
    g.config = cloneCfg(gd.showcase[0]);
    cz.garments.push(g);

    // Procedural placeholder goes in immediately so the stage is never empty,
    // then the real model replaces it when it arrives. A model that 404s or a
    // CDN that is blocked simply leaves the placeholder in place.
    useProceduralBody(g, i);
    comp.setImmediate(g.config);

    if(gd.model){
      loadGarmentModel(gd, function(m){
        if(!m || !cz.garments[i]) return;
        adoptModel(cz.garments[i], m, i);
      });
    }
  });
}

function cloneCfg(c){ var o = {}; for(var k in c) o[k] = c[k]; return o; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

function useProceduralBody(g, idx){
  var geo = g.data.build === 'tee' ? buildTeeGeo() : buildJeansGeo();
  var mat = makeGarmentMaterial(g.comp);
  var mesh = new THREE.Mesh(geo, mat);
  mesh.userData.czGarmentIndex = idx;
  g.pivot.add(mesh);
  g.body = mesh;
  g.mats = [mat];
}

// Swap the placeholder for the real model. Every mesh in it gets the SAME
// material instance, so one mixT uniform still drives the whole garment's
// crossfade — the compositor never learns there are ten meshes now.
function adoptModel(g, m, idx){
  if(g.body){
    g.pivot.remove(g.body);
    g.body.geometry.dispose();
    g.mats.forEach(function(x){ x.dispose(); });
  }
  var mat = makeGarmentMaterial(g.comp);
  m.meshes.forEach(function(mesh){ mesh.material = mat; });
  m.object.userData.czGarmentIndex = idx;
  g.pivot.add(m.object);
  g.body = m.object;
  g.mats = [mat];
  g.pattern = m.pattern;

  // Design rects come from the real pattern now, so rebuild anything showing.
  resolveStepRects(g.data, m.pattern);
  g.comp.setImmediate(g.config);
  g.setMix(0);
  if(cz.phase === 'config' && cz.active === g) buildConfigUI(g);

  console.log('[CZ] model adopted:', g.data.key, m.tris.toLocaleString(), 'tris',
              JSON.stringify(m.regionCounts),
              m.culled && m.culled.tris ? ('| culled ' + m.culled.tris.toLocaleString() +
                ' inner-surface tris (' + m.culled.names.join(', ') + ')') : '');
}

// ═══════════════════════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════════════════════
function update(dt){
  if(!cz.ready) return;
  var dtMs = dt * 1000;
  cz.t += dt;

  // Gating: when the camera is nowhere near the stage the whole thing costs one
  // distance check per frame — the regionB.visible win, reapplied.
  var near = Math.abs(cz.host.camera.position.y - CZ_STAGE_Y) < FLOOR_SPACING * 1.6;
  cz.stage.visible = near || cz.phase === 'config' || cz.phase === 'transition';
  if(!cz.stage.visible){ if(cz.ui) cz.ui.visible = false; return; }

  cz.garments.forEach(function(g, i){
    g.comp.update(dtMs);
    g.setMix(g.comp.mix);

    var isActive  = (cz.active === g);
    var isHovered = (cz.hovered === g) && cz.phase === 'focused';

    // Hover: idle rotation eases out, the garment turns to face forward and
    // grows. Same ease drives all three so they resolve together.
    var hoverWant = (isHovered || isActive) ? 1 : 0;
    g.hoverEase += (hoverWant - g.hoverEase) * Math.min(1, dt * 7.0);

    if(cz.phase === 'idle' || cz.phase === 'focused'){
      // Showcase cycling — but never while the visitor is looking straight at it.
      if(!isHovered && !isActive){
        g.showcaseT += dtMs;
        if(g.showcaseT >= SHOWCASE_MS){
          g.showcaseT = 0;
          g.showcaseIdx = (g.showcaseIdx + 1) % g.data.showcase.length;
          g.config = cloneCfg(g.data.showcase[g.showcaseIdx]);
          g.comp.crossfadeTo(g.config, XFADE_MS);
        }
      }
      // Idle spin decays to zero as hover takes hold, then the garment eases to
      // its facing angle rather than snapping.
      g.spin += g.spinVel * dt * (1 - g.hoverEase);
      if(g.hoverEase > 0.01){
        var target = Math.round(g.spin / (Math.PI*2)) * (Math.PI*2);
        g.spin += (target - g.spin) * Math.min(1, dt * 5.0 * g.hoverEase);
      }
      g.pivot.rotation.y = g.spin;
      g.pivot.position.x = g.homeX;
      g.pivot.position.y = Math.sin(cz.t*0.9 + g.bobPhase) * 0.085 * (1 - g.hoverEase*0.6);
      g.pivot.scale.setScalar(STAGE_SCALE * (1 + (HOVER_GROW-1) * g.hoverEase));
    }
    else if(cz.phase === 'transition' && isActive){
      updateTransition(g, dt);
    }
    else if(cz.phase === 'config' && isActive){
      var V = cz.view;
      // Flick inertia rather than a hard stop — the garment carries and settles
      // instead of freezing the instant you let go.
      if(!cz.drag){
        if(Math.abs(V.velYaw) > 1e-4){
          g.spin += V.velYaw * dt;
          V.velYaw *= Math.pow(0.045, dt);
        }
        if(Math.abs(V.velPitch) > 1e-4){
          V.pitch = clamp(V.pitch + V.velPitch * dt, -VIEW_LIM.pitch, VIEW_LIM.pitch);
          V.velPitch *= Math.pow(0.045, dt);
        }
      }
      // Eases to whichever face the active step prints on — but never while the
      // user is holding the garment, and never on top of a live flick.
      if(g.faceTarget !== null && !cz.drag && Math.abs(V.velYaw) < 0.05){
        g.spin += (g.faceTarget - g.spin) * Math.min(1, dt * 4.0);
      }
      g.pivot.rotation.set(V.pitch, g.spin, 0);   // XYZ order = world-axis turntable
      var L = layout();
      g.pivot.position.x = g.pageX + L.garmentDX + V.panX;
      g.pivot.position.y = L.garmentDY + V.panY + Math.sin(cz.t*0.8) * 0.05 * (V.touched ? 0 : 1);
      g.pivot.scale.setScalar(L.garmentScale * V.zoom);
    }
    else if(!isActive && (cz.phase === 'transition' || cz.phase === 'config')){
      // The garment you did not choose keeps living, just off screen.
      g.spin += g.spinVel * dt;
      g.pivot.rotation.y = g.spin;
      g.pivot.position.x = g.homeX;
      g.pivot.position.y = Math.sin(cz.t*0.9 + g.bobPhase) * 0.085;
      g.pivot.scale.setScalar(STAGE_SCALE);
    }
  });

  // Camera: the sideways move is the whole trick. Because the CAMERA travels,
  // the site genuinely slides off screen instead of dissolving — which is what
  // makes the new page feel like a place rather than a panel.
  cz.camX += (cz.camTargetX - cz.camX) * Math.min(1, dt * 3.2);
  if(cz.phase !== 'idle' || Math.abs(cz.camX) > 0.001){
    cz.host.camera.position.x = cz.camX;
  }
  // Panel entrance / exit. The rail travels in from the screen edge it is pinned
  // to — right in landscape, bottom in portrait — so it never flies across the
  // garment to reach its resting place.
  if(cz.ui){
    var U = cz.uiSlide;
    U.t = clamp(U.t + (dt / U.dur) * (U.target === 1 ? 1 : -1), 0, 1);
    if(U.target === 0 && U.t <= 0){
      destroyConfigUI();
    } else {
      var ue = 1 - Math.pow(1 - U.t, 3);          // ease-out cubic
      var L2 = layout();
      var off = (1 - ue) * U.dist;
      if(L2.portrait) cz.ui.position.set(L2.panelX, L2.panelY - off, 0);
      else            cz.ui.position.set(L2.panelX + off, L2.panelY, 0);
      cz.ui.visible = true;
      updateClipPlanes();                          // the panel moved
    }
  }

  // Segmented controls: slide the thumb, and cross-fade each label between its
  // dark and white copies as the thumb passes under it.
  for(var si=0; si<cz.segs.length; si++){
    var S = cz.segs[si];
    var cur = cz.segPos[S.id];
    if(cur === undefined) continue;
    cur += (S.target - cur) * Math.min(1, dt * 15);
    if(Math.abs(S.target - cur) < 0.2) cur = S.target;
    cz.segPos[S.id] = cur;
    S.thumb.position.x = cur;
    for(var sj=0; sj<S.segs.length; sj++){
      var sg = S.segs[sj];
      var t = clamp(1 - Math.abs(cur - sg.x) / (sg.w * 0.55), 0, 1);
      sg.light.material.opacity = t;
      sg.dark.material.opacity  = 1 - t;
    }
  }

  // Scroll momentum — a flick keeps the list moving and settles, matching how
  // the garment behaves when you flick it.
  if(cz.ui && !cz.drag && Math.abs(cz.scroll.vel) > 0.15){
    scrollBy(cz.scroll.vel);
    cz.scroll.vel *= Math.pow(0.02, dt);
    if(cz.scroll.y <= 0 || cz.scroll.y >= cz.scroll.max) cz.scroll.vel = 0;
  }
  // The panel travels with the camera during the transition, so the clip planes
  // have to be rebuilt every frame, not just on scroll.
  if(cz.ui) updateClipPlanes();
}

function updateTransition(g, dt){
  cz.transT += dt / cz.transDur;
  var p = Math.min(1, cz.transT);
  var e = 1 - Math.pow(1 - p, 3);                 // ease-out cubic

  var L = layout();
  g.pivot.position.x = g.homeX + (g.pageX + L.garmentDX - g.homeX) * e;
  g.pivot.position.y = L.garmentDY * e;
  var s0 = STAGE_SCALE * HOVER_GROW;
  g.pivot.scale.setScalar(s0 + (L.garmentScale - s0) * e);

  // Fast spin that decelerates into a canonical facing angle. spinStart already
  // holds a whole number of turns, so the landing is always face-forward.
  var turns = 3.0;
  g.spin = g.spinStart + turns * Math.PI * 2 * e;
  g.pivot.rotation.y = g.spin;

  cz.camTargetX = g.pageX;

  // Built BEFORE the camera finishes, so the panel is already sliding in as the
  // page settles rather than popping in afterwards. Two motions overlapping
  // reads as one arrival; strictly sequential reads as a stall then a jump.
  if(p >= 0.62 && !cz.ui){
    buildConfigUI(g);
    cz.uiSlide.t = 0; cz.uiSlide.target = 1; cz.uiSlide.dur = 0.42;
  }

  if(p >= 1){
    cz.phase = 'config';
    g.spin = g.spinStart + turns * Math.PI * 2;
    // Hold facing the viewer rather than drifting. A continuous idle turn would
    // fight the auto-turn that design steps trigger, so the garment only ever
    // moves for a reason — what you are looking at is what you are choosing.
    g.faceTarget = faceAngle(g, 'front');
    if(!cz.ui) buildConfigUI(g);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════════════════════════════════════
// Sizes are derived from the camera frustum the way the site's product detail
// view does it, so the panel fills the same fraction of any screen.
// Portrait is asked of the host when it offers an opinion (the harness needs a
// forced override for testing; the site may have its own idea), otherwise it
// falls back to the same aspect test the product detail view uses.
function czPortrait(){
  if(cz.host && cz.host.isPortrait) return cz.host.isPortrait();
  return cz.host.camera.aspect < 1.0;
}

// The panel is measured in PIXELS (it lives in the orthographic overlay); the
// garment is still a 3D object, so its offset is measured in world units. The
// two are linked: the garment is centred in whatever screen area the panel does
// NOT occupy, converted back to world at the garment's depth. Sizing the panel
// in pixels and deriving the garment from it — rather than guessing both as
// fractions — is what keeps them from colliding at any aspect ratio.
function layout(){
  var W = window.innerWidth, H = window.innerHeight;
  var dist = CAM_Z;
  var halfH = Math.tan((cz.host.camera.fov * Math.PI/180)/2) * dist;
  var halfW = halfH * cz.host.camera.aspect;
  var portrait = czPortrait();
  var margin = Math.round(Math.min(W, H) * 0.035);

  if(portrait){
    // Portrait analogue of a full-height rail: full width, flush to the bottom.
    var ph = Math.round(H * 0.62);
    var freeTopPx = (H - ph) / 2;                          // centre of the free band
    return {
      portrait:true, W:W, H:H, halfW:halfW, halfH:halfH, margin:margin,
      panelW:W, panelH:ph, fade:0,                         // no inner edge to fade
      panelX:0, panelY:-(H/2) + ph/2,                      // overlay space, +y up
      garmentDX:0,
      garmentDY: (1 - 2*freeTopPx/H) * halfH,              // px-from-top -> world y
      garmentScale:2.30
    };
  }
  // Landscape: a full-height rail flush to the RIGHT edge, always.
  //
  // It used to mirror to whichever side the garment did not occupy, which read
  // as a nice touch but meant the controls jumped across the screen depending on
  // which product you had picked. Pinning it makes the layout learnable, and the
  // garment simply takes whatever is left over, so the two still cannot collide.
  // (`side` still decides which way the entry transition travels.)
  var pwL = Math.round(Math.max(440, Math.min(W * 0.52, 820)));
  var panelCx = W/2 - pwL/2;                               // flush right
  var fade = 0.16;                                         // fraction that dissolves
  // The garment centres in the SOLID part of what remains, treating the faded
  // strip as still belonging to the rail. Centring it on the geometric panel
  // edge instead would push the garment under the gradient, where it reads as
  // dirt in the glass rather than as a garment behind it.
  var solidLeftPx = (panelCx - pwL/2) + pwL*fade;
  var freeCxPx = (-W/2 + solidLeftPx) / 2;
  return {
    portrait:false, W:W, H:H, halfW:halfW, halfH:halfH, margin:margin,
    panelW:pwL, panelH:H, fade:fade,
    panelX:panelCx, panelY:0,
    garmentDX: (freeCxPx / (W/2)) * halfW,                 // centred px -> world x
    garmentDY:0,
    garmentScale:3.20
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// CONFIG UI
// ═══════════════════════════════════════════════════════════════════════════
// Built from the host's glass helpers so it matches the site by construction
// rather than by imitation. Unlike the product detail view — which rebuilds its
// whole scene on every click — only the UI is rebuilt here. The garment mesh
// persists and its texture updates in place.
function scrollBy(dy){
  if(!cz.ui || cz.scroll.max <= 0) return false;
  cz.scroll.y = clamp(cz.scroll.y + dy, 0, cz.scroll.max);
  if(cz.scrollGroup) cz.scrollGroup.position.y = cz.scroll.viewTop + cz.scroll.y;
  updateClipPlanes();
  updateScrollHints();
  return true;
}

function updateScrollHints(){
  if(!cz.scroll.hintTop) return;
  var m = cz.scroll.max;
  cz.scroll.hintTop.material.opacity = m > 0 ? clamp(cz.scroll.y/24, 0, 1) * 0.45 : 0;
  cz.scroll.hintBot.material.opacity = m > 0 ? clamp((m - cz.scroll.y)/24, 0, 1) * 0.45 : 0;
}

function destroyConfigUI(){
  cz.scrollGroup = null;
  cz.segs = [];
  cz.scroll.hintTop = null; cz.scroll.hintBot = null;
  if(!cz.ui) return;
  cz.ui.traverse(function(o){
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      if(o.material.map && o.material.map.isCanvasTexture) o.material.map.dispose();
      o.material.dispose();
    }
  });
  if(cz.ui.parent) cz.ui.parent.remove(cz.ui);
  cz.ui = null;
}

function mkClickable(mesh, actionId){
  mesh.userData.clickable = true;
  mesh.userData.actionId  = actionId;
  return mesh;
}

// Text sized in WORLD units rather than canvas pixels. The host's textMesh takes
// a canvas size and a font string, which makes "how big will this actually be on
// screen" nearly impossible to reason about — every label came out tiny. This
// wrapper takes the plane's world size and a fraction of its height, computes
// the canvas to match, and leaves the host function untouched.
// Sizes are PIXELS. Because the overlay is 1:1 with the screen, the text canvas
// can be built at exactly the size it will be drawn at (times devicePixelRatio),
// so type is pixel-crisp instead of resampled — which it never could be while
// the UI floated in perspective.
function czLabel(text, pxW, pxH, o){
  o = o || {};
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cw = Math.max(16, Math.round(pxW * dpr));
  var ch = Math.max(8, Math.round(pxH * dpr));
  var fpx = Math.max(9, Math.round(ch * (o.frac || 0.60)));
  return cz.host.ui.textMesh(text, {
    cw: cw, ch: ch,
    font: (o.weight || '500') + ' ' + fpx + 'px Arial',
    color: o.color || '#3a4258',
    align: o.align || 'center',
    w: pxW, h: pxH
  });
}

// Cells are sized for legibility and the list SCROLLS when it overflows, rather
// than being squeezed to fit. Shrink-to-fit made every option smaller the more
// artwork was added, which gets worse exactly as the catalogue grows.
function planSteps(g, innerW, portrait){
  var unit = innerW;
  var labelH = unit * 0.068, gapLabel = unit * 0.020,
      rowGap = unit * 0.030, blockGap = unit * 0.055;
  var perRowThumb = portrait ? 4 : 4;
  var plan = [], total = 0;
  var segH = Math.round(Math.max(40, Math.min(unit * 0.115, 54)));
  g.data.steps.forEach(function(s){
    var n = s.values.length + (s.allowNone ? 1 : 0);
    var seg = (s.type !== 'thumb');
    if(seg){
      var hS = labelH + gapLabel + segH;
      plan.push({step:s, n:n, seg:true, segH:segH, h:hS});
      total += hS + blockGap;
      return;
    }
    var perRow = Math.min(perRowThumb, n);
    var cellW = innerW / perRow;
    var cellH = cellW * 1.02;
    var rows = Math.ceil(n / perRow);
    var h = labelH + gapLabel + rows*cellH + (rows-1)*rowGap;
    plan.push({step:s, n:n, seg:false, perRow:perRow, cellW:cellW, cellH:cellH, rows:rows, h:h});
    total += h + blockGap;
  });
  total -= blockGap;
  return {plan:plan, total:total, labelH:labelH, gapLabel:gapLabel,
          rowGap:rowGap, blockGap:blockGap, k:1};
}

// Clip planes for the scroll viewport, built the way the cart's are
// (updateCartItemClipPlanes): world-space planes derived from the panel's own
// transform, so they stay correct wherever the panel sits.
var czClipPlanes = [
  new THREE.Plane(new THREE.Vector3(0,-1,0), 0),   // discards above the top edge
  new THREE.Plane(new THREE.Vector3(0, 1,0), 0)    // discards below the bottom edge
];
// In the overlay the panel is axis-aligned and unrotated, so the planes reduce
// to two horizontal cuts at fixed pixel heights — no quaternion work needed, and
// they no longer have to be rebuilt every frame as the camera moves.
function updateClipPlanes(){
  if(!cz.ui || cz.scroll.viewTop === undefined) return;
  var top = cz.ui.position.y + cz.scroll.viewTop;
  var bot = cz.ui.position.y + cz.scroll.viewBot;
  czClipPlanes[0].normal.set(0,-1,0); czClipPlanes[0].constant = top;
  czClipPlanes[1].normal.set(0, 1,0); czClipPlanes[1].constant = -bot;
}
// ShaderMaterials need the `clipping` flag set explicitly — the chunks are
// compiled in, but three will not enable them on a raw ShaderMaterial for you.
function applyClipping(obj){
  obj.traverse(function(c){
    if(!c.material) return;
    c.material.clippingPlanes = czClipPlanes;
    if(c.material.isShaderMaterial && !c.material.clipping){
      c.material.clipping = true;
      c.material.needsUpdate = true;
    }
  });
}

function buildConfigUI(g){
  destroyConfigUI();
  var L = layout();
  var H = cz.host.ui;
  cz.ui = new THREE.Group();
  cz.ui.position.set(L.panelX, L.panelY, 0);   // pixels, overlay space
  // How far it has to travel to sit completely off screen. Measured from the
  // layout rather than guessed, so it stays exactly off-screen at any size.
  cz.uiSlide.dist = L.portrait ? L.panelH : L.panelW;
  cz.host.overlay().scene.add(cz.ui);

  var PW = L.panelW, PH = L.panelH;
  cz.ui.add(czGlassPanel(PW, PH, 'panel'));

  // Content lives in the SOLID part of the rail, past the fade. It sits in its
  // own group so every position below stays relative to the content box, rather
  // than every call having to remember the offset.
  var padX = PW * 0.06, padY = PH * 0.042;
  var solidL = -PW/2 + PW*(L.fade || 0);
  var contentL = solidL + padX, contentR = PW/2 - padX;
  var innerW = contentR - contentL;
  var content = new THREE.Group();
  content.position.x = (contentL + contentR)/2;
  cz.ui.add(content);

  function addAt(mesh, mx, my, z){
    mesh.position.set(mx, my, z === undefined ? 1 : z);
    content.add(mesh);
    return mesh;
  }

  var top = PH/2 - padY, bottom = -PH/2 + padY;

  // ── Header (pinned) ──
  var product = cz.host.shopify.byHandle(g.data.shopifyHandle);
  var titleH = PH * 0.072, priceH = PH * 0.044;
  var y = top;
  addAt(czLabel(g.data.title, innerW, titleH, {frac:0.74, weight:'600', color:'#232a3c'}),
        0, y - titleH/2);
  y -= titleH + PH*0.006;
  if(product){
    addAt(czLabel('$' + product.price, innerW, priceH, {frac:0.74, color:'#6b7488'}),
          0, y - priceH/2);
    y -= priceH;
  }
  y -= PH * 0.026;

  // ── Footer (pinned, measured before the steps so the viewport is exact) ──
  var btnH = PH * 0.072, backH = PH * 0.056;
  var footerH = btnH + PH*0.016 + backH;

  // ── Scroll viewport: everything between the pinned header and footer ──
  cz.scroll.viewTop = y;
  cz.scroll.viewBot = bottom + footerH + PH*0.026;
  cz.scroll.viewH = cz.scroll.viewTop - cz.scroll.viewBot;

  var scrollGroup = new THREE.Group();
  content.add(scrollGroup);
  cz.scrollGroup = scrollGroup;
  function addScroll(mesh, mx, my, z){
    mesh.position.set(mx, my, z === undefined ? 1 : z);
    scrollGroup.add(mesh);
    return mesh;
  }

  // ── Steps — the UI walks the manifest, which is what makes an undecided jeans
  //    option list a non-blocker. Laid out from y=0 downward in scroll-local
  //    space; the group is then offset by the scroll position. ──
  var P = planSteps(g, innerW, L.portrait);
  var sy = 0;
  P.plan.forEach(function(b, bi){
    addScroll(czLabel(b.step.label.toUpperCase(), innerW, P.labelH,
          {frac:0.62, weight:'600', color:'#8a93a8', align:'left'}), 0, sy - P.labelH/2);
    sy -= P.labelH + P.gapLabel;

    var vals = b.step.values.slice();
    if(b.step.allowNone) vals = [{v:'None', none:true}].concat(vals);

    if(b.seg){
      addScroll(buildSegmented(b.step, vals, innerW, b.segH, g), 0, sy - b.segH/2, 2);
      sy -= b.segH;
      if(bi < P.plan.length - 1) sy -= P.blockGap;
      return;
    }

    for(var i=0;i<vals.length;i++){
      var row = Math.floor(i/b.perRow), col = i % b.perRow;
      // Rows are centred so a short final row does not hang off to one side.
      var inRow = Math.min(b.perRow, vals.length - row*b.perRow);
      var cx = -(inRow * b.cellW)/2 + b.cellW*(col + 0.5);
      var cy = sy - b.cellH*0.5 - row*(b.cellH + P.rowGap);
      var val = vals[i];
      addScroll(buildCell(b.step, val, b.cellW*0.90, b.cellH*0.90,
                      g.config[b.step.id] === val.v,
                      b.step.option ? variantAvailable(g.data, g.config, b.step.id, val.v) : true,
                      g), cx, cy, 2);
    }
    sy -= b.rows*b.cellH + (b.rows-1)*P.rowGap;
    if(bi < P.plan.length - 1) sy -= P.blockGap;
  });

  cz.scroll.contentH = -sy;
  cz.scroll.max = Math.max(0, cz.scroll.contentH - cz.scroll.viewH);
  cz.scroll.y = clamp(cz.scroll.y, 0, cz.scroll.max);
  scrollGroup.position.set(0, cz.scroll.viewTop + cz.scroll.y, 0);

  // Only the scrolling content is clipped — the pinned header and footer must
  // stay legible even while rows slide past behind them.
  applyClipping(scrollGroup);
  updateClipPlanes();

  // A hairline at each edge of the viewport, shown only when there is actually
  // something hidden in that direction. Cheapest honest scroll affordance.
  cz.scroll.hintTop = addAt(scrollHint(innerW), 0, cz.scroll.viewTop - 1, 6);
  cz.scroll.hintBot = addAt(scrollHint(innerW), 0, cz.scroll.viewBot + 1, 6);

  // ── Actions ──
  var btnW = innerW * 0.64;
  var addY = bottom + backH + PH*0.016 + btnH/2;
  var addBtn = czGlassPanel(btnW, btnH, 'button');
  mkClickable(addBtn, 'cz-add');
  addAt(addBtn, 0, addY, 2);
  addAt(czLabel('ADD TO CART', btnW*0.92, btnH*0.52, {frac:0.78, weight:'600', color:'#ffffff'}),
        0, addY, 4);

  var backY = bottom + backH/2;
  var smallW = innerW * 0.29;
  var backBtn = czGlassPanel(smallW, backH, 'buttonAlt');
  mkClickable(backBtn, 'cz-back');
  addAt(backBtn, -innerW/2 + smallW/2, backY, 2);
  addAt(czLabel('BACK', smallW*0.9, backH*0.5, {frac:0.72, color:'#6b7488'}),
        -innerW/2 + smallW/2, backY, 4);

  // Recentres the inspect view. Sits next to BACK because that is where you look
  // when you have rotated somewhere you did not mean to.
  var resetX = -innerW/2 + smallW*1.5 + innerW*0.03;
  var resetBtn = czGlassPanel(smallW, backH, 'buttonAlt');
  mkClickable(resetBtn, 'cz-reset');
  addAt(resetBtn, resetX, backY, 2);
  addAt(czLabel('RESET VIEW', smallW*0.92, backH*0.5, {frac:0.60, color:'#6b7488'}),
        resetX, backY, 4);

  // The config code doubles as the thing fulfillment reads and the thing a link
  // encodes, so showing it here keeps the harness honest.
  // Wide enough for a full code. At the previous width a 23-character config
  // overran its canvas and got chopped off at the left.
  addAt(czLabel(encodeConfig(g.data, g.config), innerW*0.44, backH*0.42,
        {frac:0.52, color:'#a3abbd', align:'right'}),
        innerW/2 - innerW*0.22, backY, 4);
}

function scrollHint(w){
  var m = new THREE.Mesh(
    new THREE.PlaneGeometry(w*0.995, 1.5),
    new THREE.MeshBasicMaterial({color:0x8a93a8, transparent:true, opacity:0,
                                 depthWrite:false, depthTest:false})
  );
  m.renderOrder = 24;
  return m;
}

// Apple-style segmented control: a recessed track, one sliding dark thumb, and
// labels that invert as the thumb passes under them.
//
// The inversion is done with TWO labels per segment — a dark one and a white one
// stacked — cross-faded by the thumb's distance. Recolouring a canvas texture
// mid-slide would mean re-rasterising type every frame; cross-fading two static
// textures is free and gives a smoother handover than a hard swap at the
// midpoint.
function buildSegmented(step, vals, w, h, g){
  var grp = new THREE.Group();
  var n = vals.length, pad = 3;
  var segW = (w - pad*2) / n;

  grp.add(czGlassPanel(w, h, 'track'));
  var thumb = czGlassPanel(segW, h - pad*2, 'thumb');
  thumb.position.z = 1;
  grp.add(thumb);

  var segs = [];
  for(var i=0;i<n;i++){
    var val = vals[i];
    var cx = -w/2 + pad + segW*(i + 0.5);
    var enabled = step.option ? variantAvailable(g.data, g.config, step.id, val.v) : true;
    var hasDot = step.type === 'swatch' && val.hex;
    var textCx = hasDot ? cx + segW*0.12 : cx;

    if(hasDot){
      var dot = new THREE.Mesh(
        new THREE.PlaneGeometry(Math.min(18, segW*0.22), Math.min(18, segW*0.22)),
        new THREE.MeshBasicMaterial({color:new THREE.Color(val.hex), transparent:true,
                                     opacity: enabled ? 1 : 0.35,
                                     depthWrite:false, depthTest:false})
      );
      dot.renderOrder = 22;
      dot.position.set(cx - segW*0.26, 0, 4);
      grp.add(dot);
    }

    // Invisible full-segment hit target, so the whole segment is clickable —
    // not just the glyphs.
    var hit = new THREE.Mesh(new THREE.PlaneGeometry(segW, h),
                             new THREE.MeshBasicMaterial({visible:false}));
    hit.position.set(cx, 0, 3);
    if(enabled) mkClickable(hit, 'cz-set-' + step.id + '-' + val.v);
    grp.add(hit);

    var lw = (hasDot ? segW*0.68 : segW*0.9), lh = h*0.40;
    var dark = czLabel(val.v, lw, lh, {frac:0.74, weight:'600',
                       color: enabled ? '#3a4258' : '#aab0bd'});
    dark.position.set(textCx, 0, 4);
    grp.add(dark);
    var light = czLabel(val.v, lw, lh, {frac:0.74, weight:'600', color:'#ffffff'});
    light.position.set(textCx, 0, 5);
    light.material.opacity = 0;
    grp.add(light);

    segs.push({x:cx, w:segW, dark:dark, light:light});
  }

  var selIdx = 0;
  for(var k=0;k<n;k++) if(vals[k].v === g.config[step.id]) selIdx = k;
  var target = -w/2 + pad + segW*(selIdx + 0.5);
  // Position is remembered ACROSS rebuilds. Every option change rebuilds the UI,
  // so without this the thumb would teleport instead of sliding.
  if(cz.segPos[step.id] === undefined) cz.segPos[step.id] = target;
  thumb.position.x = cz.segPos[step.id];
